<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
<title>MIDI 播放器 · 88键可视化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d14; --panel:#16161f; --border:#2a2a3a; --text:#e8e8f0;
  --dim:#8a8aa0; --accent:#8b5cf6; --accent2:#6366f1; --ok:#2fbf6f; --warn:#e8b64c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.container{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:13px;margin-bottom:16px}
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .container{padding:0}
  h1,.subtitle{display:none}
  body{overflow:hidden;height:100vh;height:100dvh}
}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.visual-panel{padding:12px;position:relative;overflow:hidden}
.panel h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}

/* 菜单/调试按钮组（可拖拽，自动淡出） */
.fab-group{
  position:fixed;left:0;top:67%;transform:translateY(-50%);
  z-index:10000;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:opacity .4s ease, transform .4s ease, left .3s ease;
  opacity:1;
}
.fab-group.faded{opacity:0.5}
.fab-group.hidden-btn{display:none !important}
.menu-btn{
  display:none;
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(22,22,31,.85);border:1px solid var(--border);
  color:#2fbf6f;font-size:18px;cursor:grab;
  align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  touch-action:none;user-select:none;
  flex:0 0 auto;
}
.menu-btn.faded{opacity:0.5}
.menu-btn:active{cursor:grabbing}
.menu-btn.hidden-btn{display:none !important}
@media(max-width:800px){.menu-btn{display:flex}}

/* 调试按钮：与菜单按钮同尺寸，中间绿色 DEBUG 文字；默认位于菜单按钮正上方 */
.debug-fab{
  display:flex;
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(22,22,31,.85);border:1px solid var(--border);
  color:#2fbf6f;font-family:monospace;font-size:9px;font-weight:bold;letter-spacing:.5px;
  align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(8px);user-select:none;
  flex:0 0 auto;
}

/* 自定义配色弹窗的目标选择按钮 */
.palette-target{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:6px 8px;border-radius:8px;cursor:pointer;
  border:1px solid #333;background:rgba(255,255,255,.04);color:#ddd;font-size:12px;
}
.palette-target.active{border-color:#8b5cf6;background:rgba(139,92,246,.18);color:#fff}
.palette-target .sw{width:22px;height:14px;border-radius:3px;border:1px solid #555;flex-shrink:0}

/* 去掉移动端默认点击高亮（按外接矩形绘制、不裁圆角），改用随圆角裁切的按下反馈 */
*{-webkit-tap-highlight-color:transparent}
button:active,[onclick]:active,[role="button"]:active,a:active{opacity:.78}

/* 圆形配色按钮（A/B/C 与编辑图标）：与播放控制按钮同尺寸（32px）并对齐 */
.pal-btn{
  width:27px;height:27px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  padding:0;border:none;cursor:pointer;
  background:var(--accent);color:#fff;
  font-family:'Google Sans','Product Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:12px;font-weight:400;
  transition:background .15s,box-shadow .15s;
}
/* 选中：实心主题紫 + 外圈白框标识（与播放控制按钮一致的选中观感） */
.pal-btn.active{background:var(--accent);color:#fff}
.pal-btn:hover{background:#7c3aed}
/* 按下反馈 */
.pal-btn:active{background:#6d28d9;opacity:1}
.pal-btn:focus{outline:none}
/* 键盘焦点轮廓跟随圆角（仅键盘触发，触屏不显示） */
.pal-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* 统一下拉面板：从控制行下方展开，浮在渲染区之上，最大高度约渲染区 2/3 */
.drop-panel{
  position:absolute;top:100%;right:0;z-index:10050;display:none;
  width:min(92vw,460px);max-height:66.67vh;overflow-y:auto;
  margin-top:6px;
  border:1px solid var(--border);border-radius:12px;padding:12px;
  box-shadow:0 14px 44px rgba(0,0,0,.55);
  background:rgba(0,0,0,0);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.drop-panel.open{display:block}
/* 全屏时设置面板改挂到渲染区左上角（由 _syncFsLayout 移动并加 .in-fs） */
.control-panel.in-fs{position:fixed;top:14px;left:62px;right:auto;margin-top:0;max-height:66.67vh}
.control-panel > .dbg-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
.overlay-mask{display:none}
@media(max-width:800px){
  /* 右侧容器固定全屏 */
  .layout > div:last-child{position:fixed;inset:0;display:flex;flex-direction:column}
  .top-bar{flex-shrink:0}
  .visual-panel{flex:1;border-radius:0;border:none;padding:0;min-height:0;position:relative;overflow:hidden}
  #visualCanvas{height:100% !important;border-radius:0}
}

/* 配色方案按钮：与播放控制同尺寸（32px）、单行对齐 */
.pal-grid{display:flex;gap:6px;flex-shrink:0}

/* 控制行：播放控制 + 设置/调试/配色/全屏 */
.control-row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;position:relative}
.ctl-btn{
  width:32px;height:32px;flex-shrink:0;padding:0;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);
  transition:background .15s,color .15s;
}
.ctl-btn:hover{background:rgba(255,255,255,.1)}
.ctl-btn:active{background:rgba(255,255,255,.18);opacity:1}
.ctl-btn:disabled{opacity:.4;cursor:not-allowed}
.ctl-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl-btn.primary:hover{background:#7c3aed}
.ctl-btn svg{width:16px;height:16px}
#settingsBtn svg,#paletteToggleBtn svg,#uploadBtn svg{width:18px;height:18px}
/* 重播图标放大，让外圈尽量贴近按钮边界 */
#replayBtn svg{width:30px;height:30px}
/* 配色面板：从控制行下方展开（absolute，不遮挡按钮） */
.palette-row{display:none;align-items:center;gap:8px;flex-wrap:nowrap;min-width:230px}
.palette-row.open{display:flex}
#paletteToggleIcon{transition:transform .2s}

/* 谱面管理面板：统一下拉浮层 */
.manage-panel{display:none}
.manage-panel.open{display:block}
.manage-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.manage-head h3{margin:0;font-size:14px;color:var(--text);flex:1}
.manage-appearance{display:flex;gap:10px;font-size:10px;color:var(--dim)}
.manage-appearance label{display:flex;align-items:center;gap:4px;cursor:pointer}
.manage-appearance input[type=range]{width:64px}
.manage-close{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;line-height:1}
.manage-close:hover{color:var(--text)}
#manageList{overflow-y:auto;flex:1}
.manage-section{color:var(--dim);font-size:12px;margin:12px 0 6px}
.manage-empty{color:var(--dim);text-align:center;padding:16px;font-size:12px}
.manage-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.04)}
.manage-row .name{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manage-row .tag{font-size:12px;color:var(--dim)}
.icon-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;display:inline-flex;align-items:center;border-radius:6px}
.icon-btn:hover{color:var(--text);background:rgba(255,255,255,.08)}
.icon-btn.del:hover{color:#ff6b6b}
.icon-btn.dl:hover{color:var(--accent)}
.icon-btn svg{width:16px;height:16px}
.icon-btn:disabled{opacity:.85;cursor:default;background:none}
.icon-btn.loading svg{animation:_spin .8s linear infinite}
.icon-btn .btn-pct{font-size:10px;font-weight:600;color:var(--accent)}
.csel-act{margin-left:auto;display:inline-flex;align-items:center;flex-shrink:0}
.csel-act .icon-btn{padding:2px}
@keyframes _spin{to{transform:rotate(360deg)}}

/* 菜单面板内的调试区 */
.dbg-section{margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}
.dbg-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:10px;color:var(--dim);margin-bottom:6px}
.dbg-toolbar label{display:flex;align-items:center;gap:4px;cursor:pointer}
.dbg-toolbar input[type=range]{width:64px}
.appearance-sliders{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#playModeLabel{color:#fff}
.dbg-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.dbg-actions button{background:#333;color:#fff;border:none;width:26px;height:26px;padding:0;cursor:pointer;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.dbg-actions button svg{width:14px;height:14px}
.dbg-actions button:hover{background:#444}
.dbg-reset-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:#7f1d1d;color:#fff;border:1px solid #b91c1c;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;opacity:1;backdrop-filter:none;-webkit-backdrop-filter:none}
.dbg-reset-btn:hover{background:#991b1b;color:#fff}
.dbg-reset-btn:active{background:#6b1616}
.dbg-reset-btn svg{width:14px;height:14px}
.dbg-log{
  height:200px;overflow-y:auto;padding:4px 8px;line-height:1.4;
  font-family:monospace;font-size:11px;
  background:rgba(0,0,0,.35);border:1px solid #333;border-radius:6px;
}
.dbg-off .dbg-body{display:none}
.dbg-off .dbg-off-hint{display:block}
.dbg-off-hint{display:none;font-size:11px;color:var(--dim);padding:6px 2px}

/* 滑动开关（替代勾选框） */
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--dim);user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{position:relative;width:34px;height:18px;border-radius:9px;background:#c9ccd6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);transition:background .15s;flex-shrink:0}
.switch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track .knob{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;min-height:40px}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#7c3aed}
.btn:disabled{opacity:.4;cursor:not-allowed}
.speed-btn{border-radius:10px !important;border:none !important;background:rgba(124,58,237,.15) !important;color:#c4b5fd !important}
.speed-btn.active{background:var(--accent) !important;color:#fff !important;font-weight:600}
.speed-btn:hover{background:rgba(124,58,237,.3) !important}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* 顶部控制栏（可视化区上方） */
.top-bar{
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:8px 10px;margin-bottom:8px;
}
.top-bar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top-bar .btn{padding:4px 6px;min-height:28px;font-size:11px;border-radius:10px;border:none;white-space:nowrap;flex-shrink:0}
.top-bar select{padding:4px 8px;font-size:12px;border-radius:10px;width:140px;flex:0 0 auto;flex-shrink:0;min-height:28px}
.top-bar .song-name{font-size:11px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.top-bar .progress-wrap{margin:4px 0 0}
.top-bar .progress-bar{height:8px}
.top-bar .time-row{font-size:11px;margin-top:2px}
@media(max-width:800px){
  .top-bar{border-radius:0;border-left:none;border-right:none;border-top:none;margin-bottom:0}
}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{font-size:12px;color:var(--dim);min-width:60px}
.row input[type=range]{flex:1;accent-color:var(--accent);height:8px;border-radius:4px;cursor:pointer}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.row input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
.row input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.row input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.row .val{font-size:12px;color:var(--text);min-width:40px;text-align:right}
/* 键数版型预设按钮 */
.kb-presets{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.kb-preset{
  padding:4px 8px;border-radius:8px;cursor:pointer;font-size:11px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--dim);
}
.kb-preset:hover{background:rgba(255,255,255,.1);color:var(--text)}
.kb-preset.active{background:var(--accent);border-color:var(--accent);color:#fff}
select{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;cursor:pointer}
select:focus{border-color:var(--accent)}

/* ===== 自定义下拉：替代原生 select，修复桌面端 option 白底白字不可读 ===== */
.csel{position:relative;min-width:0}
.row .csel,.top-bar .csel{flex:1;min-width:0}
.csel-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer;text-align:left;
  font-family:inherit;min-height:40px;transition:border-color .15s,background .15s;
}
.csel-trigger:hover{background:rgba(255,255,255,.09)}
.csel-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.csel.open .csel-trigger{border-color:var(--accent)}
.csel-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel-caret{flex-shrink:0;width:14px;height:14px;color:var(--dim);transition:transform .15s}
.csel.open .csel-caret{transform:rotate(180deg)}
.csel-pop{
  position:fixed;z-index:10050;display:none;
  background:#1b1b26;border:1px solid var(--border);border-radius:12px;
  box-shadow:0 16px 48px rgba(0,0,0,.55);padding:6px;
}
.csel-pop.open{display:flex;flex-direction:column}
.csel-search{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;margin-bottom:6px;
}
.csel-search:focus{border-color:var(--accent)}
.csel-list{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:1px}
.csel-group{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px 3px;font-weight:600}
.csel-opt{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;
  white-space:nowrap;overflow:hidden;
}
.csel-opt:hover,.csel-opt.active{background:rgba(255,255,255,.08)}
.csel-opt.selected{background:rgba(139,92,246,.28);color:#fff;font-weight:600}
.csel-opt .csel-opt-label{overflow:hidden;text-overflow:ellipsis}
.csel-opt .csel-check{flex-shrink:0;width:14px;height:14px;opacity:0;color:var(--accent)}
.csel-opt.selected .csel-check{opacity:1}
.csel-empty{padding:16px;text-align:center;color:var(--dim);font-size:12px}
.top-bar .csel-trigger{padding:4px 8px;font-size:12px;border-radius:10px;min-height:28px}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.progress-wrap{margin:12px 0}
.progress-bar{height:6px;background:#e5e5e5;border-radius:3px;overflow:hidden;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}
.time-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-top:4px}
#statusText{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#visualCanvas{width:100%;height:500px;background:#0a0a10;border-radius:8px;display:block}
/* PC：整页锁定视口高度，绘制区自适应剩余高度，钢琴始终在屏幕底部、无需滚动 */
@media(min-width:801px){
  html,body{height:100%}
  body{height:100vh;height:100dvh;overflow:hidden}
  .container{height:100%;display:flex;flex-direction:column;padding:12px 16px 8px}
  .layout{flex:1;min-height:0;display:flex;flex-direction:column}
  .layout > div:last-child{flex:1;min-height:0;display:flex;flex-direction:column}
  .top-bar{flex-shrink:0}
  .visual-panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px}
  #visualCanvas{flex:1;min-height:0;height:auto}
}
/* 全屏绘制区 */
.visual-panel:fullscreen{padding:0;background:#000;display:flex;flex-direction:column;position:relative}
.visual-panel:fullscreen #visualCanvas{flex:1;min-height:0;width:100%;height:auto !important;border-radius:0}
/* 全屏悬浮按钮：设置(左上)、退出(右上)；仅全屏显示 */
.fs-overlay{display:none}
.visual-panel:fullscreen .fs-overlay,
.visual-panel:-webkit-full-screen .fs-overlay{display:block}
.fs-float-btn{
  position:absolute;z-index:5;width:42px;height:42px;border-radius:50%;padding:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  opacity:.5;transition:opacity .3s, transform .3s;
  backdrop-filter:none;-webkit-backdrop-filter:none;filter:none;
}
.fs-float-btn:active{opacity:.7}
.fs-float-btn svg{width:20px;height:20px}
/* 活跃：内缩 14px 完整显示；空闲：吸附到左右边界只露半边圆 */
.fs-settings{top:0;left:0;transform:translate(14px,14px)}
.fs-exit{top:0;right:0;transform:translate(-14px,14px)}
/* 2s 未点击悬浮按钮：淡到 20% 并向左上/右上角吸附到露出 70% */
.fs-overlay.faded .fs-float-btn{opacity:.2}
.fs-overlay.faded .fs-settings{transform:translate(-30%,-30%)}
.fs-overlay.faded .fs-exit{transform:translate(30%,-30%)}
/* 调试面板：从控制行下方展开（absolute，不遮挡按钮） */
.debug-panel{display:none}
.debug-panel.open{display:block}
.file-info{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.file-info b{color:var(--text)}
.timbre-hint{font-size:11px;color:var(--dim);margin-top:4px;min-height:16px}
</style>
</head>
<body>
<div class="container">
  <h1>MIDI 播放器</h1>
  <p class="subtitle">88 键钢琴可视化 · 多音色 · 变速播放</p>

  <div class="layout">
    <!-- 右侧：顶部控制栏 + 可视化 -->
    <div>
      <div class="top-bar">
        <div class="top-bar-row">
          <button class="ctl-btn primary" id="replayBtn" onclick="replayPlay()" disabled title="重播"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M19 12c0 3.866-3.134 7-7 7s-7-3.134-7-7 3.134-7 7-7a6.986 6.986 0 0 1 5.32 2.45"/><path d="M17.6 5.35V7.8h-2.45"/><path d="M10.5 8.8 15.3 12 10.5 15.2Z" stroke-linejoin="miter"/></svg></button>
          <select id="songSel" onchange="onSongChange(this.value)" style="flex:1">
            <option value="">加载谱库…</option>
          </select>
          <button class="ctl-btn primary" id="fsBtn" onclick="toggleFullscreen()" title="全屏绘制区" aria-label="全屏绘制区">
            <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9 15L2 22M2 16.1429V22H7.85714"/><path d="M15 9L22 2M22 7.85714V2H16.1429"/></g></svg>
          </button>
        </div>
        <div class="control-row">
          <button class="ctl-btn primary" id="playBtn" onclick="togglePlay()" disabled title="播放"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
          <button class="ctl-btn primary" id="nextBtn" onclick="nextSong()" disabled title="下一首"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
          <button class="ctl-btn primary" id="loopBtn" onclick="toggleLoop()" disabled title="列表循环"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink:0"><path d="M11 5.466V4H5a4 4 0 0 0-3.584 5.777a.5.5 0 1 1-.896.446A5 5 0 0 1 5 3h6V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192m3.81.086a.5.5 0 0 1 .67.225A5 5 0 0 1 11 13H5v1.466a.25.25 0 0 1-.41.192l-2.36-1.966a.25.25 0 0 1 0-.384l2.36-1.966a.25.25 0 0 1 .41.192V12h6a4 4 0 0 0 3.585-5.777a.5.5 0 0 1 .225-.67Z"/></svg></button>
          
          <button class="ctl-btn primary" id="uploadBtn" onclick="document.getElementById('midiFile').click()" title="上传MIDI" aria-label="上传MIDI"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" style="flex-shrink:0"><path d="M4.5 11.5a3 3 0 0 1 3-3h8.718a4 4 0 0 1 2.325.745l4.914 3.51a4 4 0 0 0 2.325.745H40.5a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3h-33a3 3 0 0 1-3-3z"/><path d="M24 33.5v-14m6.167 6.167L24 19.5l-6.167 6.167"/></svg></button>
          <button class="ctl-btn primary drop-trigger" id="manageBtn" style="margin-left:auto" onclick="toggleManageModal()" title="管理谱面" aria-label="管理谱面"><svg viewBox="0 0 20 20" fill="currentColor" style="flex-shrink:0"><path d="M16.81 10.548a1.87 1.87 0 1 1 2.644 2.644l-4.829 4.83a2.2 2.2 0 0 1-1.021.578l-1.498.375a.89.89 0 0 1-1.079-1.08l.374-1.497c.097-.387.297-.74.579-1.021zM3.25 13.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m8.023 1.17a3.2 3.2 0 0 0-.597.83H7.75a.75.75 0 0 1 0-1.5h4.192zM3.25 8.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m14 .5q.159 0 .297.06c-.53.11-1.034.37-1.445.78l-.659.66H7.75a.75.75 0 0 1 0-1.5zm-14-5.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m14 .5a.75.75 0 0 1 0 1.5h-9.5a.75.75 0 0 1 0-1.5z"/></svg></button>
          <button class="ctl-btn primary drop-trigger" id="settingsBtn" onclick="toggleMenu()" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path fill-rule="evenodd" d="M12.4277 2C11.3139 2 10.2995 2.6007 8.27081 3.80211L7.58466 4.20846C5.55594 5.40987 4.54158 6.01057 3.98466 7C3.42773 7.98943 3.42773 9.19084 3.42773 11.5937V12.4063C3.42773 14.8092 3.42773 16.0106 3.98466 17C4.54158 17.9894 5.55594 18.5901 7.58466 19.7915L8.27081 20.1979C10.2995 21.3993 11.3139 22 12.4277 22C13.5416 22 14.5559 21.3993 16.5847 20.1979L17.2708 19.7915C19.2995 18.5901 20.3139 17.9894 20.8708 17C21.4277 16.0106 21.4277 14.8092 21.4277 12.4063V11.5937C21.4277 9.19084 21.4277 7.98943 20.8708 7C20.3139 6.01057 19.2995 5.40987 17.2708 4.20846L16.5847 3.80211C14.5559 2.6007 13.5416 2 12.4277 2ZM8.67773 12C8.67773 9.92893 10.3567 8.25 12.4277 8.25C14.4988 8.25 16.1777 9.92893 16.1777 12C16.1777 14.0711 14.4988 15.75 12.4277 15.75C10.3567 15.75 8.67773 14.0711 8.67773 12Z" clip-rule="evenodd"/></svg></button>
          <button class="ctl-btn primary drop-trigger" id="paletteToggleBtn" onclick="togglePaletteRow()" title="配色面板" aria-label="配色面板"><svg id="paletteToggleIcon" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.61-.23-1.2-.64-1.67a.53.53 0 0 1-.13-.33c0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6c0-4.96-4.49-9-10-9m5.5 11c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5m-3-4c-.83 0-1.5-.67-1.5-1.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9M5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S7.33 13 6.5 13S5 12.33 5 11.5m6-4c0 .83-.67 1.5-1.5 1.5S8 8.33 8 7.5S8.67 6 9.5 6s1.5.67 1.5 1.5"/></svg></button>
          <button class="ctl-btn primary drop-trigger" id="debugToggleBtn" onclick="toggleDebugPanel()" title="调试面板" aria-label="调试面板"><svg viewBox="0 0 32 32" fill="currentColor" style="flex-shrink:0"><path d="m29.83 20l.34-2l-5.17-.85v-4.38l5.06-1.36l-.51-1.93l-4.83 1.29A9 9 0 0 0 20 5V2h-2v2.23a8.8 8.8 0 0 0-4 0V2h-2v3a9 9 0 0 0-4.71 5.82L2.46 9.48L2 11.41l5 1.36v4.38L1.84 18l.32 2L7 19.18a8.9 8.9 0 0 0 .82 3.57l-4.53 4.54l1.42 1.42l4.19-4.2a9 9 0 0 0 14.2 0l4.19 4.2l1.42-1.42l-4.54-4.54a8.9 8.9 0 0 0 .83-3.57ZM15 25.92A7 7 0 0 1 9 19v-6h6ZM9.29 11a7 7 0 0 1 13.42 0ZM23 19a7 7 0 0 1-6 6.92V13h6Z"/></svg></button>
          <input type="file" id="midiFile" accept=".mid,.midi" style="display:none" onchange="onMidiFile(event)">
          <div id="paletteRow" class="palette-row drop-panel">
            <div class="pal-grid">
              <button class="pal-btn palette-btn" data-palette="A" onclick="setPalette('A')" title="纯紫">A</button>
              <button class="pal-btn palette-btn active" data-palette="B" onclick="setPalette('B')" title="青蓝×琥珀红">B</button>
              <button class="pal-btn palette-btn" data-palette="C" onclick="setPalette('C')" title="青绿×品红">C</button>
              <button class="pal-btn" id="paletteEditBtn" onclick="openPaletteModal()" title="自定义配色">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M8.203 2.004c1.261 0 2.304 1.103 2.476 2.538l8.483 8.484l-7.778 7.778a3 3 0 0 1-4.243 0L2.9 16.562a3 3 0 0 1 0-4.243l2.804-2.805V4.961c0-1.633 1.12-2.957 2.5-2.957m.5 2.957v1.553l-1 1V4.961c0-.327.224-.591.5-.591c.277 0 .5.264.5.591m0 5.914V9.342l-4.39 4.391a1 1 0 0 0 0 1.414l4.243 4.243a1 1 0 0 0 1.414 0l6.364-6.364l-5.63-5.63v3.48l-.003.128h-2.01a1 1 0 0 0 .012-.129" clip-rule="evenodd"/><path d="M16.859 16.875a3 3 0 1 0 4.242 0l-2.121-2.121z"/></svg>
              </button>
            </div>
            <div id="paletteSwatch" style="flex:1 1 0;min-width:0;max-width:340px;height:44px;position:relative;"></div>
          </div>
          <div class="debug-panel drop-panel" id="debugPanel">
            <div class="dbg-toolbar">
              <label class="switch"><input id="dbgEnabled" type="checkbox" checked onchange="onDebugEnabledChange()"><span class="track"><span class="knob"></span></span>启用调试</label>
              <button class="dbg-reset-btn" id="debugResetBtn" onclick="resetAllSettings()" title="重置所有设置"><span>重置所有选项</span><svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.854 2.646a.5.5 0 0 1 0 .708L4.207 5H11a6 6 0 1 1-6 6a.5.5 0 0 1 1 0a5 5 0 1 0 5-5H4.207l1.647 1.646a.5.5 0 1 1-.708.708l-2.5-2.5a.5.5 0 0 1 0-.708l2.5-2.5a.5.5 0 0 1 .708 0"/></svg></button>
            </div>
            <div class="dbg-off-hint">调试已关闭，无日志采集与监控。</div>
            <div class="dbg-body">
              <div class="dbg-actions">
                <label class="switch">
                  <input id="dbgAutoOpen" type="checkbox" checked onchange="onDbgAutoOpenChange()">
                  <span class="track"><span class="knob"></span></span>降级自动展开
                </label>
                <button class="dbg-icon-btn" id="debugCopyBtn" onclick="copyDebugTerminal()" title="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                <button class="dbg-icon-btn" onclick="downloadDebugLog()" title="下载日志"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5l5 5l5-5m-5 5V3"/></svg></button>
                <button class="dbg-icon-btn" onclick="clearDebugTerminal()" title="清空"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-6 5v6m4-6v6"/></svg></button>
                <button class="dbg-icon-btn" onclick="scrollDebugTop()" title="顶部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15l-6-6l-6 6"/></svg></button>
                <button class="dbg-icon-btn" onclick="scrollDebugBottom()" title="底部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9l6 6l6-6"/></svg></button>
              </div>
              <div id="debugTerminalContent" class="dbg-log"></div>
            </div>
          </div>
          <!-- 左侧控制面板（仅设置项） -->
          <div class="panel control-panel drop-panel" id="controlPanel">
            <div class="dbg-section" id="appearanceSection">
              <div class="dbg-toolbar">
                <div class="appearance-sliders">
                  <label title="面板透明度">透明 <input id="panelTransparency" type="range" min="0" max="100" step="5" value="100" oninput="applyPanelAppearance()"></label>
                  <label title="面板背景模糊">模糊 <input id="panelBlur" type="range" min="0" max="100" step="5" value="25" oninput="applyPanelAppearance()"></label>
                </div>
                <label class="switch" title="欣赏模式：音符自动发声；音游模式：需点击琴键发声" style="margin-left:auto">
                  <input id="playModeSw" type="checkbox" checked onchange="onPlayModeChange()">
                  <span class="track"><span class="knob"></span></span>
                  <span id="playModeLabel">欣赏模式</span>
                </label>
              </div>
            </div>
            <div class="row">
              <label>音乐倍速</label>
              <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" oninput="onSpeedChange()">
              <span class="val" id="speedVal">1.0x</span>
            </div>
            <div class="row">
              <label>下落流速</label>
              <input type="range" id="fallSpeedSlider" min="0.2" max="5" step="0.1" value="1" oninput="onFallSpeedChange()">
              <span class="val" id="fallSpeedVal">1.0x</span>
            </div>
            <div class="row">
              <label>钢琴高度</label>
              <input type="range" id="pianoHeightSlider" min="5" max="50" step="1" value="16" oninput="onPianoHeightChange()">
              <span class="val" id="pianoHeightVal">16%</span>
            </div>
            <div class="row">
              <label>宽度缩放</label>
              <input type="range" id="pianoWidthSlider" min="1" max="4" step="0.001" value="1" oninput="onPianoWidthChange()">
              <span class="val" id="pianoWidthVal">1.0×</span>
            </div>
            <div class="row">
              <label>水平偏移</label>
              <input type="range" id="pianoOffsetSlider" min="0" max="100" step="0.01" value="0" oninput="onPianoOffsetChange()">
              <span class="val" id="pianoOffsetVal">0%</span>
            </div>
            <div class="row">
              <label>键数版型</label>
              <input type="range" id="keyboardPresetSlider" min="0" max="5" step="1" value="0" oninput="onKeyboardPresetChange()">
              <span class="val" id="keyboardPresetVal">88键</span>
            </div>

            <div class="row">
              <label>音色选择</label>
              <select id="timbreSel" onchange="onTimbreChange()">
                <option value="__synth__">合成钢琴</option>
                <optgroup label="键盘">
                  <option value="acoustic_grand_piano">三角钢琴</option>
                  <option value="bright_acoustic_piano">亮音钢琴</option>
                  <option value="electric_grand_piano">电三角钢琴</option>
                  <option value="electric_piano_1">电钢琴1</option>
                  <option value="electric_piano_2">电钢琴2</option>
                  <option value="honkytonk_piano">酒吧钢琴</option>
                  <option value="harpsichord">大键琴</option>
                  <option value="clavinet" selected>古钢琴</option>
                </optgroup>
                <optgroup label="风琴/打击">
                  <option value="drawbar_organ">拉杆风琴</option>
                  <option value="percussive_organ">打击风琴</option>
                  <option value="rock_organ">摇滚风琴</option>
                  <option value="church_organ">教堂管风琴</option>
                  <option value="celesta">钢片琴</option>
                  <option value="vibraphone">颤音琴</option>
                  <option value="marimba">马林巴</option>
                  <option value="xylophone">木琴</option>
                  <option value="tubular_bells">管钟</option>
                </optgroup>
                <optgroup label="吉他/贝斯">
                  <option value="acoustic_guitar_nylon">古典吉他</option>
                  <option value="acoustic_guitar_steel">民谣吉他</option>
                  <option value="electric_guitar_jazz">爵士电吉他</option>
                  <option value="electric_guitar_clean">清音电吉他</option>
                  <option value="overdriven_guitar">过载吉他</option>
                  <option value="distortion_guitar">失真吉他</option>
                  <option value="acoustic_bass">原声贝斯</option>
                  <option value="electric_bass_finger">指弹电贝斯</option>
                  <option value="electric_bass_pick">拨片电贝斯</option>
                  <option value="fretless_bass">无品贝斯</option>
                </optgroup>
                <optgroup label="弦乐">
                  <option value="violin">小提琴</option>
                  <option value="viola">中提琴</option>
                  <option value="cello">大提琴</option>
                  <option value="contrabass">低音提琴</option>
                  <option value="pizzicato_strings">拨弦弦乐</option>
                  <option value="orchestral_harp">竖琴</option>
                  <option value="string_ensemble_1">弦乐合奏1</option>
                  <option value="string_ensemble_2">弦乐合奏2</option>
                </optgroup>
                <optgroup label="铜管/木管">
                  <option value="trumpet">小号</option>
                  <option value="trombone">长号</option>
                  <option value="french_horn">圆号</option>
                  <option value="tuba">大号</option>
                  <option value="brass_section">铜管合奏</option>
                  <option value="soprano_sax">高音萨克斯</option>
                  <option value="alto_sax">中音萨克斯</option>
                  <option value="tenor_sax">次中音萨克斯</option>
                  <option value="baritone_sax">上低音萨克斯</option>
                  <option value="oboe">双簧管</option>
                  <option value="bassoon">巴松管</option>
                  <option value="clarinet">单簧管</option>
                  <option value="piccolo">短笛</option>
                  <option value="flute">长笛</option>
                  <option value="recorder">竖笛</option>
                  <option value="pan_flute">排箫</option>
                </optgroup>
                <optgroup label="合成器">
                  <option value="lead_1_square">方波主音</option>
                  <option value="lead_2_sawtooth">锯齿主音</option>
                  <option value="lead_7_fifths">五度主音</option>
                  <option value="pad_4_choir">合唱垫音</option>
                </optgroup>
              </select>
            </div>

          </div>
      <div id="manageModal" class="drop-panel manage-panel">
        <div class="manage-head">
          <h3>谱面管理</h3>
          <button class="manage-close" onclick="closeManageModal()" title="关闭">✕</button>
        </div>
        <div id="manageList"></div>
      </div>
        </div>
        <div class="stats-bar" style="font-size:10px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between">
          <span><span id="statTracks">轨道：-</span> · <span id="statTotal">音符：-</span></span>
          <span><span id="statPlayed">已播：-/-</span> · <span id="statPercent">0.00%</span></span>
        </div>
        <div class="progress-wrap">
          <div class="time-row">
            <span id="curTime">0:00</span>
            <span id="statusText"></span>
            <span id="totalTime">0:00</span>
          </div>
          <div class="progress-bar" id="progressBar" onmousedown="startSeek(event)" ontouchstart="startSeek(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <div id="fileInfo" style="display:none"></div>
      </div>
      <div class="panel visual-panel">
        <canvas id="visualCanvas"></canvas>
        <div class="fs-overlay" id="fsOverlay">
          <button class="fs-float-btn fs-settings" id="fsSettingsBtn" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path fill-rule="evenodd" d="M12.4277 2C11.3139 2 10.2995 2.6007 8.27081 3.80211L7.58466 4.20846C5.55594 5.40987 4.54158 6.01057 3.98466 7C3.42773 7.98943 3.42773 9.19084 3.42773 11.5937V12.4063C3.42773 14.8092 3.42773 16.0106 3.98466 17C4.54158 17.9894 5.55594 18.5901 7.58466 19.7915L8.27081 20.1979C10.2995 21.3993 11.3139 22 12.4277 22C13.5416 22 14.5559 21.3993 16.5847 20.1979L17.2708 19.7915C19.2995 18.5901 20.3139 17.9894 20.8708 17C21.4277 16.0106 21.4277 14.8092 21.4277 12.4063V11.5937C21.4277 9.19084 21.4277 7.98943 20.8708 7C20.3139 6.01057 19.2995 5.40987 17.2708 4.20846L16.5847 3.80211C14.5559 2.6007 13.5416 2 12.4277 2ZM8.67773 12C8.67773 9.92893 10.3567 8.25 12.4277 8.25C14.4988 8.25 16.1777 9.92893 16.1777 12C16.1777 14.0711 14.4988 15.75 12.4277 15.75C10.3567 15.75 8.67773 14.0711 8.67773 12Z" clip-rule="evenodd"/></svg></button>

<script>
// ===== 调试终端：重定向console输出到页面 =====
const _origLog = console.log.bind(console);
const _origWarn = console.warn.bind(console);
const _origError = console.error.bind(console);
let _debugContentEl = null;
let debugEnabled = true; // 调试总开关：关闭后无日志采集、无监控、无降级自动展开

// 将 console 参数安全转为字符串：对象走 JSON，循环引用等异常时回退 String
// 音色 id -> 界面显示名（如 clavinet -> 古钢琴），用于日志与状态区
function timbreDisplayName(id){
  if(id === '__synth__') return '合成钢琴';
  const sel = document.getElementById('timbreSel');
  if(sel && sel.options){
    for(let i = 0; i < sel.options.length; i++){ if(sel.options[i].value === id) return sel.options[i].textContent; }
  }
  return id;
}

function _fmtArgs(args){
  return args.map(a => {
    if(typeof a === 'object' && a !== null){
      try{ return JSON.stringify(a); }catch(e){ return String(a); }
    }
    return String(a);
  }).join(' ');
}

// 日志颜色：蓝色 info（下载等）、绿色（正常/恢复）、黄色 warn、红色 error
function _debugColor(type, msg) {
  if(msg.indexOf('[INFO]') >= 0) return '#4ea1ff';
  if(msg.indexOf('[OK]') >= 0) return '#2fbf6f';
  if(type === 'warn') return '#ff0';
  if(type === 'error') return '#f44';
  return '#0f0';
}

// 进度条上方的实时状态区（乐谱/音色下载进度、完成提示、调试日志）
let _statusTimer = null;
function setStatus(text, sticky){
  const el = document.getElementById('statusText');
  if(!el) return;
  el.textContent = text || '';
  if(_statusTimer){ clearTimeout(_statusTimer); _statusTimer = null; }
  if(text && !sticky){ _statusTimer = setTimeout(() => { el.textContent = ''; }, 3500); }
}
function _appendDebug(msg, type) {
  // 调试面板未展开时，把最新日志精简后显示到状态区（去掉 [AudioDebug][LEVEL] 前缀）
  const _dp = document.getElementById('debugPanel');
  // 仅把 INFO 日志镜像到状态区（去掉前缀），避免性能告警等噪声刷屏
  if(type === 'log' && (!_dp || !_dp.classList.contains('open'))){
    setStatus(String(msg).replace(/^\[AudioDebug\](\[[A-Za-z]+\])?\s*/, ''));
  }
  if(!_debugContentEl) {
    _debugContentEl = document.getElementById('debugTerminalContent');
  }
  const time = new Date().toLocaleTimeString();
  const color = _debugColor(type, msg);
  const line = document.createElement('div');
  line.style.color = color;
  line.style.wordBreak = 'break-all';
  line.textContent = '[' + time + '] ' + msg;
  if(_debugContentEl) {
    // 仅当用户原本就在底部附近时才自动跟随；否则保持当前位置，不打断查看历史
    const atBottom = _debugContentEl.scrollHeight - _debugContentEl.scrollTop - _debugContentEl.clientHeight < 40;
    _debugContentEl.appendChild(line);
    // 限制DOM行数，防止调试输出本身造成内存/渲染压力
    while(_debugContentEl.childElementCount > 300){
      _debugContentEl.removeChild(_debugContentEl.firstChild);
    }
    if(atBottom) _debugContentEl.scrollTop = _debugContentEl.scrollHeight;
  }
}

console.log = function(...args) {
  _origLog(...args);
  if(!debugEnabled) return;
  const msg = _fmtArgs(args);
  if(msg.includes('AudioDebug')) _appendDebug(msg, 'log');
};
// 高频告警折叠：同一类消息 1.5s 内只记录一次，其余计数汇总，避免刷屏与主线程开销
const _warnFold = {};
console.warn = function(...args) {
  _origWarn(...args);
  if(!debugEnabled) return;
  const msg = _fmtArgs(args);
  if(!msg.includes('AudioDebug')) return;
  const key = msg.slice(0, 28);
  const now = performance.now();
  const rec = _warnFold[key] || (_warnFold[key] = {t: 0, n: 0});
  if(now - rec.t < 1500){ rec.n++; return; }
  const folded = rec.n > 0 ? ('（同类告警已折叠 ' + rec.n + ' 次）') : '';
  rec.t = now; rec.n = 0;
  _appendDebug(msg + folded, 'warn');
};
console.error = function(...args) {
  _origError(...args);
  if(!debugEnabled) return;
  const msg = _fmtArgs(args);
  if(msg.includes('AudioDebug')) _appendDebug(msg, 'error');
};

// ===== 调试总开关（默认开启）=====
function setDebugEnabled(on){
  debugEnabled = !!on;
  try{ localStorage.setItem('debugEnabled', debugEnabled ? '1' : '0'); }catch(e){}
  document.body.classList.toggle('dbg-off', !debugEnabled);
  const cb = document.getElementById('dbgEnabled');
  if(cb) cb.checked = debugEnabled;
}
function onDebugEnabledChange(){
  const cb = document.getElementById('dbgEnabled');
  setDebugEnabled(cb ? cb.checked : true);
  if(debugEnabled){
    console.log('[AudioDebug][INFO] 调试已开启');
    // 为减少性能影响：透明度 20%（较暗）、模糊 0%
    const tp = document.getElementById('panelTransparency');
    const bl = document.getElementById('panelBlur');
    if(tp) tp.value = '20';
    if(bl) bl.value = '0';
    applyPanelAppearance();
    // 降级自动展开默认打开
    const auto = document.getElementById('dbgAutoOpen');
    if(auto && !auto.checked){ auto.checked = true; onDbgAutoOpenChange(); }
    setStatus('为减少性能影响，已设透明度 20%、模糊 0%');
  }
}

// 面板透明度 / 背景模糊：透明滑块 100 = 全透明（alpha 0），0 = 全黑
// 菜单面板、调试面板、选谱弹层、谱面管理弹窗共享同一组值并绑定
function _panelTargets(){
  const list = [
    document.getElementById('controlPanel'),
    document.getElementById('debugPanel'),
    document.getElementById('paletteRow'),
    document.getElementById('manageModal')
  ];
  document.querySelectorAll('.csel-pop').forEach(el => list.push(el));
  return list;
}
function _applyAllAppearance(transparency, blurPct){
  const alpha = Math.max(0, Math.min(1, (100 - transparency) / 100));
  const blurPx = blurPct * 0.2;                          // 100% -> 20px
  const bf = blurPx > 0 ? ('blur(' + blurPx.toFixed(1) + 'px)') : 'none';
  _panelTargets().forEach(el => {
    if(!el) return;
    el.style.background = 'rgba(0,0,0,' + alpha + ')';
    el.style.backdropFilter = bf;
    el.style.webkitBackdropFilter = bf;
  });
  const setV = (id, v) => { const e = document.getElementById(id); if(e) e.value = v; };
  setV('panelTransparency', transparency);
  setV('panelBlur', blurPct);
  try{
    localStorage.setItem('panelTransparency', String(transparency));
    localStorage.setItem('panelBlur', String(blurPct));
  }catch(e){}
}
function applyPanelAppearance(){
  const tp = document.getElementById('panelTransparency');
  const bl = document.getElementById('panelBlur');
  _applyAllAppearance(tp ? parseFloat(tp.value) : 100, bl ? parseFloat(bl.value) : 25);
}
// ===== 统一下拉面板：从控制行下方展开，最大高度约渲染区 2/3 =====
function _closeDropPanelsOnly(except){
  document.querySelectorAll('.drop-panel.open').forEach(p => { if(p !== except) p.classList.remove('open'); });
}
// 关闭所有下拉面板 + 选谱/音色下拉（互斥）
function closeAllDropPanels(except){
  _closeDropPanelsOnly(except);
  if(typeof closeAllCustomSelects === 'function') closeAllCustomSelects();
}
// 点击面板 / 触发按钮 / 下拉以外区域：关闭所有
document.addEventListener('pointerdown', (e) => {
  const t = e.target;
  if(t && t.closest && (t.closest('.drop-panel') || t.closest('.drop-trigger') || t.closest('.csel') || t.closest('.csel-pop'))) return;
  closeAllDropPanels();
}, true);
// 调试面板：从控制行下方展开（CSS absolute 定位）
function toggleDebugPanel(){
  const p = document.getElementById('debugPanel');
  if(!p) return;
  const willOpen = !p.classList.contains('open');
  closeAllDropPanels(p);
  p.classList.toggle('open');
  if(willOpen) _syncDebugPanelHeight();
}
// 调试面板底边与设置面板对齐：按设置面板实际高度设置调试面板高度
function _syncDebugPanelHeight(){
  const dp = document.getElementById('debugPanel');
  const cp = document.getElementById('controlPanel');
  if(!dp || !cp) return;
  const wasOpen = cp.classList.contains('open');
  if(!wasOpen){ cp.style.visibility = 'hidden'; cp.style.display = 'block'; }
  const h = cp.offsetHeight;
  if(!wasOpen){ cp.style.display = ''; cp.style.visibility = ''; }
  if(h > 0){ dp.style.height = h + 'px'; dp.style.maxHeight = h + 'px'; }
}

// 性能降级时是否自动展开调试区（默认勾选）
let dbgAutoOpen = true;
function onDbgAutoOpenChange(){
  const cb = document.getElementById('dbgAutoOpen');
  dbgAutoOpen = !!(cb && cb.checked);
  try{ localStorage.setItem('dbgAutoOpen', dbgAutoOpen ? '1' : '0'); }catch(e){}
}
// 降级时自动展开调试面板并滚到日志底部
function autoOpenDebugPanel(){
  if(!debugEnabled || !dbgAutoOpen) return;
  const panel = document.getElementById('debugPanel');
  if(panel){ closeAllDropPanels(panel); panel.classList.add('open'); _syncDebugPanelHeight(); }
  setTimeout(() => { if(typeof scrollDebugBottom === 'function') scrollDebugBottom(); }, 0);
}

function clearDebugTerminal() {
  const el = document.getElementById('debugTerminalContent');
  if(el) el.innerHTML = '';
}
function scrollDebugTop(){
  const el = document.getElementById('debugTerminalContent');
  if(el) el.scrollTop = 0;
}
function scrollDebugBottom(){
  const el = document.getElementById('debugTerminalContent');
  if(el) el.scrollTop = el.scrollHeight;
}
function _copyFeedback(ok){
  const btn = document.getElementById('debugCopyBtn');
  if(!btn) return;
  if(!btn._origText) btn._origText = btn.textContent;
  btn.textContent = ok ? 'copied✓' : 'failed';
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = btn._origText; }, 1200);
}
function _copyFallback(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    _copyFeedback(ok);
  }catch(e){ _copyFeedback(false); }
}
function copyDebugTerminal(){
  const el = document.getElementById('debugTerminalContent');
  if(!el) return;
  const text = el.innerText || '';
  if(!text){ _copyFeedback(false); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => _copyFeedback(true), () => _copyFallback(text));
  } else {
    _copyFallback(text);
  }
}
// 下载日志文本
function downloadDebugLog(){
  const el = document.getElementById('debugTerminalContent');
  const text = el ? (el.innerText || '') : '';
  try{
    const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = 'midi-player-debug-' + ts + '.log';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){}
}

// 初始化：恢复调试开关、面板外观与自动展开勾选
(function(){
  try{
    const d = localStorage.getItem('debugEnabled');
    if(d !== null) debugEnabled = d === '1';
    const t = localStorage.getItem('panelTransparency');
    const b = localStorage.getItem('panelBlur');
    if(t !== null){ const el = document.getElementById('panelTransparency'); if(el) el.value = t; }
    if(b !== null){ const el = document.getElementById('panelBlur'); if(el) el.value = b; }
    const s = localStorage.getItem('dbgAutoOpen');
    if(s !== null) dbgAutoOpen = s === '1';
  }catch(e){}
  const cb = document.getElementById('dbgEnabled');
  if(cb) cb.checked = debugEnabled;
  const ac = document.getElementById('dbgAutoOpen');
  if(ac) ac.checked = dbgAutoOpen;
  document.body.classList.toggle('dbg-off', !debugEnabled);
  applyPanelAppearance();
})();
</script>

<script>
/* ============================================================
 * 1. 音频上下文
 * ========================================================== */
let audioCtx = null;
let masterGain = null;
let outputAnalyser = null;

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1.0;
  // 在 master 与 destination 之间插一个 Analyser，用于探测"实际输出是否静音"
  outputAnalyser = audioCtx.createAnalyser();
  outputAnalyser.fftSize = 2048;
  masterGain.connect(outputAnalyser);
  outputAnalyser.connect(audioCtx.destination);
  // 监听AudioContext状态变化
  audioCtx.addEventListener('statechange', () => {
    console.warn('[AudioDebug] AudioContext状态变化:', audioCtx.state, '时间:', audioCtx.currentTime.toFixed(2));
  });
  console.log('[AudioDebug][INFO] AudioContext已创建 sampleRate=' + audioCtx.sampleRate +
    ' baseLatency=' + (audioCtx.baseLatency != null ? (audioCtx.baseLatency * 1000).toFixed(1) + 'ms' : 'N/A') +
    ' outputLatency=' + (audioCtx.outputLatency != null ? (audioCtx.outputLatency * 1000).toFixed(1) + 'ms' : 'N/A') +
    ' state=' + audioCtx.state);
  if(debugEnabled) AudioDebugMonitor.init();
}

/* ============================================================
 * 1.5 性能诊断监控（重点排查：音频线程过载 / 节点泄漏 / 主线程长任务）
 * ========================================================== */
/* 性能仲裁：2 秒窗口。窗口内累计的性能问题（严重丢帧/音符积压/音频时钟停摆/时间戳异常）
   达到阈值 -> 同时降级渲染与音频；窗口内问题低于阈值 -> 恢复完整渲染与播放。 */
const PerfArbiter = {
  degraded: false,
  windowSize: 2,       // 仲裁窗口：2 秒
  DEGRADE_AT: 3,       // 2 秒内累计问题次数达到该值 -> 降级
  RECOVER_AT: 1,       // 2 秒内累计问题次数低于等于该值 -> 恢复
  perSecond: [],
  push(info){
    this.perSecond.push(info);
    while(this.perSecond.length > this.windowSize) this.perSecond.shift();
    const total = this.perSecond.reduce((s, x) => s + x.total, 0);
    if(!this.degraded && this.perSecond.length >= this.windowSize && total >= this.DEGRADE_AT){
      this.degraded = true;
      const parts = [];
      if(info.drop) parts.push('丢帧');
      if(info.backlog) parts.push('积压');
      if(info.stall) parts.push('停摆');
      if(info.ts) parts.push('时间戳');
      console.warn('[AudioDebug] 最近 ' + this.windowSize + 's出现' + total +
        '次性能问题，分别是' + parts.join('、') + '，触发渲染降级');
      applyDegradation(true);
      // 按勾选设置自动展开调试区（不自动收起）
      if(debugEnabled) autoOpenDebugPanel();
    } else if(this.degraded && this.perSecond.length >= this.windowSize && total <= this.RECOVER_AT){
      this.degraded = false;
      console.log('[AudioDebug][OK] 性能问题已缓解，恢复完整渲染。');
      applyDegradation(false);
    }
  }
};

// 渲染 + 音频同步降级/恢复
function applyDegradation(on){
  // 音频：降低复音上限、提高同音重触发下限
  SoundfontLoader.MAX_VOICES = on ? 64 : 128;
  const base = SoundfontLoader.baseRetriggerFloor || 0;
  SoundfontLoader.retriggerFloor = on ? Math.max(base, 0.03) : base;
}

const AudioDebugMonitor = {
  inited: false,
  lastReport: 0,
  frames: 0,          // 本次统计窗口内 playLoop 帧数
  frameMsSum: 0,
  notesTriggered: 0,
  skippedNotes: 0,
  drawMsSum: 0,
  lastFrameAudioTime: 0,
  audioStalls: 0,
  severeDrops: 0,     // 本窗口内帧间隔 >100ms 的严重丢帧次数
  timestampAnomalies: 0, // 音频时钟回退等时间戳异常次数
  lastAt: 0,
  lastAudioTime: 0,
  lastWall: 0,
  rc: null,
  rcAvg: 0,
  rcUnderrun: 0,
  rmsLast: 0,
  rmsMinWindow: 1,
  lastLoudTime: 0,
  _rmsBuf: null,
  lastLiveNodes: null,
  liveGrowthReports: 0,

  init(){
    if(!debugEnabled) return;
    if(this.inited) return;
    this.inited = true;
    this.lastAudioTime = audioCtx ? audioCtx.currentTime : 0;
    this.lastWall = performance.now();

    // AudioRenderCapacity：直接反映音频渲染线程负载，是判断"UI不卡但声音卡"的关键指标
    try{
      if(audioCtx && audioCtx.renderCapacity){
        this.rc = audioCtx.renderCapacity;
        this.rc.onupdate = (e) => {
          this.rcAvg = e.averageLoad;
          this.rcUnderrun = Math.max(this.rcUnderrun, e.underrunRatio);
          if(e.peakLoad > 0.9 || e.underrunRatio > 0.02){
            console.warn('[AudioDebug] 音频渲染线程过载! avg=' + e.averageLoad.toFixed(3) +
              ' peak=' + e.peakLoad.toFixed(3) + ' underrunRatio=' + e.underrunRatio.toFixed(4));
          }
        };
        this.rc.start({updateInterval: 1});
        console.log('[AudioDebug][INFO] renderCapacity 已启用');
      } else {
        console.log('[AudioDebug][INFO] 当前浏览器不支持 renderCapacity（建议Chrome 116+）');
      }
    }catch(e){ console.warn('[AudioDebug] renderCapacity 启动失败:', e.message || e); }

    // 主线程长任务监控（>50ms），判断GC/解析是否阻塞主线程
    try{
      if(window.PerformanceObserver){
        new PerformanceObserver((list) => {
          for(const entry of list.getEntries()){
            if(entry.duration > 100){
              console.warn('[AudioDebug] 主线程长任务 ' + entry.duration.toFixed(0) + 'ms');
            }
          }
        }).observe({entryTypes: ['longtask']});
      }
    }catch(e){}
  },

  // 每帧调用：记录帧耗时与触发音符数
  frame(ms, notes){
    if(!debugEnabled) return;
    this.frames++;
    this.frameMsSum += ms;
    this.notesTriggered += notes;
  },

  // 每帧调用：记录 drawScene 耗时
  drawFrame(ms){
    if(!debugEnabled) return;
    this.drawMsSum += ms;
  },

  // 采样实际输出音量（RMS），用于探测"界面在跑但没声音"
  sampleRms(){
    if(!debugEnabled || !outputAnalyser) return;
    const buf = this._rmsBuf || (this._rmsBuf = new Float32Array(outputAnalyser.fftSize));
    outputAnalyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for(let i = 0; i < buf.length; i++){ const v = buf[i]; sum += v * v; }
    const rms = Math.sqrt(sum / buf.length);
    this.rmsLast = rms;
    if(rms < this.rmsMinWindow) this.rmsMinWindow = rms;
    if(rms > 0.001) this.lastLoudTime = performance.now();
  },

  // 主动暂停 / 恢复播放时重置时钟基线：避免恢复后第一次汇总把暂停时长误判为"停摆"
  resetClocks(){
    this.lastWall = performance.now();
    this.lastAudioTime = audioCtx ? audioCtx.currentTime : 0;
    this.lastReport = 0;
  },

  // 每秒汇总一次
  report(){
    if(!debugEnabled) return;
    if(typeof SoundfontLoader === 'undefined') return;
    const now = performance.now();
    if(now - this.lastReport < 1000) return;
    const winSec = (now - this.lastReport) / 1000;
    this.lastReport = now;

    const at = audioCtx ? audioCtx.currentTime : 0;
    const wallDelta = now - this.lastWall;
    const audioDeltaMs = (at - this.lastAudioTime) * 1000;
    // 音频时钟停摆检测：真实时间在走，但 audioCtx.currentTime 几乎不前进
    if(wallDelta > 1200 && audioDeltaMs < wallDelta * 0.3){
      this.audioStalls++;
      console.warn('[AudioDebug] 音频时钟疑似停摆! wall+' + wallDelta.toFixed(0) +
        'ms 但 audioTime+' + audioDeltaMs.toFixed(0) + 'ms state=' + (audioCtx ? audioCtx.state : 'null'));
    }
    this.lastWall = now;
    this.lastAudioTime = at;

    const d = SoundfontLoader.debug;
    const sampleLive = d.srcCreated - d.onendedFired;
    const synthLive = SoundfontLoader.synthVoices.length;
    const liveNodes = sampleLive + synthLive;
    const activeKeys = SoundfontLoader.activeSources.filter(s => s !== null).length;

    // 输出静音探测：仅「欣赏模式」有意义（音符应自动发声）。
    // 音游模式由用户按键决定发声，音符间隔静音属正常，不监测。
    const playing = (typeof isPlaying !== 'undefined') && isPlaying;
    const autoSounding = _autoSoundingMode();
    const silentSec = this.lastLoudTime ? (now - this.lastLoudTime) / 1000 : 0;
    if(autoSounding && playing && this.notesTriggered > 0 && silentSec > 1.5){
      console.warn('[AudioDebug] ★输出静音 ' + silentSec.toFixed(1) + 's 但仍在触发音符! rms=' +
        this.rmsLast.toFixed(6) + ' minRms=' + this.rmsMinWindow.toFixed(6) +
        ' state=' + (audioCtx ? audioCtx.state : 'null') +
        ' liveNodes=' + liveNodes + ' activeKeys=' + activeKeys +
        ' created=' + d.srcCreated + ' ended=' + d.onendedFired);
    }

    // 本秒性能问题计数：严重丢帧 / 音符积压 / 音频时钟停摆 / 时间戳异常
    const fps = this.frames / winSec;
    const stallDelta = this.audioStalls - (this._lastStallCount || 0);
    this._lastStallCount = this.audioStalls;
    if(this.lastAt && at < this.lastAt - 0.001) this.timestampAnomalies++;
    this.lastAt = at;
    const info = {
      drop: this.severeDrops,
      backlog: this.skippedNotes > 0 ? 1 : 0,
      stall: stallDelta,
      ts: this.timestampAnomalies
    };
    info.total = info.drop + info.backlog + info.stall + info.ts;
    if(playing && this.frames > 0){
      PerfArbiter.push(info);
    }
    // 具体告警（折叠机制会限频）
    if(playing && this.skippedNotes > 0){
      console.warn('[AudioDebug] 音符积压：跳过 ' + this.skippedNotes + ' 个');
    }
    if(playing && this.frames > 0 && fps < 30){
      console.warn('[AudioDebug] 帧率偏低 fps=' + fps.toFixed(0) + ' 预期60fps' +
        ' drawMs=' + (this.drawMsSum / this.frames).toFixed(1) +
        ' schedMs=' + (this.frameMsSum / this.frames).toFixed(1));
    }
    // 清零本秒问题计数
    this.severeDrops = 0;
    this.timestampAnomalies = 0;

    // 不再输出周期性汇总；仅在异常/降级/恢复时输出 warn 或 info
    // 存活节点持续增长 = 泄漏信号（onended 未触发 / disconnect 未执行）
    if(this.lastLiveNodes != null && liveNodes > this.lastLiveNodes + 50){
      this.liveGrowthReports++;
      if(this.liveGrowthReports >= 3){
        console.warn('[AudioDebug] 存活节点持续增长! live=' + liveNodes +
          '（疑似泄漏：onended未触发或disconnect未执行）');
        this.liveGrowthReports = 0;
      }
    } else {
      this.liveGrowthReports = 0;
    }
    this.lastLiveNodes = liveNodes;
    // 窗口统计清零
    this.frames = 0; this.frameMsSum = 0;
    this.notesTriggered = 0; this.skippedNotes = 0;
    this.drawMsSum = 0;
    this.rmsMinWindow = 1;
  }
};
// 是否处于「音符应自动发声」的模式（欣赏模式）；音游模式不监测输出静音

  try{ return typeof playMode === 'undefined' || playMode === 'appreciate'; }catch(e){ return true; }
}
