<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
<title>MIDI 播放器 · 88键可视化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://fastly.jsdelivr.net">
<link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://gcore.jsdelivr.net">
<link rel="preconnect" href="https://testingcf.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://testingcf.jsdelivr.net">
<style>html,body{background:#0d0d14;color:#e6edf3}body{visibility:hidden}#appLoading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;visibility:visible;z-index:99999}#appLoading::after{content:'';width:34px;height:34px;border:3px solid rgba(230,237,243,.22);border-top-color:#e6edf3;border-radius:50%;animation:appspin .8s linear infinite}@keyframes appspin{to{transform:rotate(360deg)}}</style>
<script>
/* 首屏主题色：在样式之后、渲染之前同步应用已保存的配色，避免「先紫后红」闪烁 */
(function(){
  try{
    var T = { A:'#8b5cf6', B:'#c20c0c', C:'#fb7299' };
    var name = localStorage.getItem('paletteV2') || 'B';
    var color = T[name] || '#c20c0c';
    if(name === 'custom'){
      var o = JSON.parse(localStorage.getItem('paletteCustom') || '{}');
      if(o.theme) color = o.theme;
    }
    var h = color.replace('#','');
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var a = 1;
    if(h.length === 8){ a = parseInt(h.slice(6,8),16)/255; h = h.slice(0,6); }
    var n = parseInt(h,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    var st = document.documentElement.style;
    st.setProperty('--accent', color);
    st.setProperty('--accent-a18', 'rgba('+r+','+g+','+b+','+(0.18*a).toFixed(3)+')');
    st.setProperty('--accent-a28', 'rgba('+r+','+g+','+b+','+(0.28*a).toFixed(3)+')');
  }catch(e){}
})();
</script>
</head>
<body>
<div id="appLoading" aria-label="加载中"></div>
<div class="container">
  <h1>MIDI 播放器</h1>
  <p class="subtitle">88 键钢琴可视化 · 多音色 · 变速播放</p>

  <div class="layout">
    <!-- 右侧：顶部控制栏 + 可视化 -->
    <div>
      <div class="top-bar">
        <div class="top-bar-row">
          <button class="ctl-btn primary" id="replayBtn" onclick="replayPlay()" disabled title="重播"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M19 12c0 3.866-3.134 7-7 7s-7-3.134-7-7 3.134-7 7-7a6.986 6.986 0 0 1 5.32 2.45"/><path d="M17.6 5.35V7.8h-2.45"/><path d="M10.5 8.8 15.3 12 10.5 15.2Z" stroke-linejoin="miter"/></svg></button>
          <select id="songSel" onchange="onSongChange(this.value)" style="flex:1">
            <option value="">加载谱库…</option>
          </select>
          <button class="ctl-btn primary" id="fsBtn" onclick="toggleFullscreen()" title="全屏绘制区" aria-label="全屏绘制区">
            <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9 15L2 22M2 16.1429V22H7.85714"/><path d="M15 9L22 2M22 7.85714V2H16.1429"/></g></svg>
          </button>
        </div>
        <div class="control-row">
          <div class="ctl-group">
            <button class="ctl-btn primary" id="playBtn" onclick="togglePlay()" disabled title="播放"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
            <button class="ctl-btn primary" id="nextBtn" onclick="nextSong()" disabled title="下一首"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
            <button class="ctl-btn primary" id="loopBtn" onclick="toggleLoop()" disabled title="列表循环"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink:0"><path d="M11 5.466V4H5a4 4 0 0 0-3.584 5.777a.5.5 0 1 1-.896.446A5 5 0 0 1 5 3h6V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192m3.81.086a.5.5 0 0 1 .67.225A5 5 0 0 1 11 13H5v1.466a.25.25 0 0 1-.41.192l-2.36-1.966a.25.25 0 0 1 0-.384l2.36-1.966a.25.25 0 0 1 .41.192V12h6a4 4 0 0 0 3.585-5.777a.5.5 0 0 1 .225-.67Z"/></svg></button>
            <button class="ctl-btn primary" id="uploadBtn" onclick="document.getElementById('midiFile').click()" title="上传MIDI" aria-label="上传MIDI"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" style="flex-shrink:0"><path d="M4.5 11.5a3 3 0 0 1 3-3h8.718a4 4 0 0 1 2.325.745l4.914 3.51a4 4 0 0 0 2.325.745H40.5a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3h-33a3 3 0 0 1-3-3z"/><path d="M24 33.5v-14m6.167 6.167L24 19.5l-6.167 6.167"/></svg></button>
          </div>
          <div class="ctl-spacer"></div>
          <div class="ctl-group">
            <button class="ctl-btn primary drop-trigger" id="manageBtn" onclick="toggleManageModal()" title="管理谱面" aria-label="管理谱面"><svg viewBox="0 0 20 20" fill="currentColor" style="flex-shrink:0"><path d="M16.81 10.548a1.87 1.87 0 1 1 2.644 2.644l-4.829 4.83a2.2 2.2 0 0 1-1.021.578l-1.498.375a.89.89 0 0 1-1.079-1.08l.374-1.497c.097-.387.297-.74.579-1.021zM3.25 13.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m8.023 1.17a3.2 3.2 0 0 0-.597.83H7.75a.75.75 0 0 1 0-1.5h4.192zM3.25 8.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m14 .5q.159 0 .297.06c-.53.11-1.034.37-1.445.78l-.659.66H7.75a.75.75 0 0 1 0-1.5zm-14-5.5a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m14 .5a.75.75 0 0 1 0 1.5h-9.5a.75.75 0 0 1 0-1.5z"/></svg></button>
            <button class="ctl-btn primary drop-trigger" id="settingsBtn" onclick="toggleMenu()" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path fill-rule="evenodd" d="M12.4277 2C11.3139 2 10.2995 2.6007 8.27081 3.80211L7.58466 4.20846C5.55594 5.40987 4.54158 6.01057 3.98466 7C3.42773 7.98943 3.42773 9.19084 3.42773 11.5937V12.4063C3.42773 14.8092 3.42773 16.0106 3.98466 17C4.54158 17.9894 5.55594 18.5901 7.58466 19.7915L8.27081 20.1979C10.2995 21.3993 11.3139 22 12.4277 22C13.5416 22 14.5559 21.3993 16.5847 20.1979L17.2708 19.7915C19.2995 18.5901 20.3139 17.9894 20.8708 17C21.4277 16.0106 21.4277 14.8092 21.4277 12.4063V11.5937C21.4277 9.19084 21.4277 7.98943 20.8708 7C20.3139 6.01057 19.2995 5.40987 17.2708 4.20846L16.5847 3.80211C14.5559 2.6007 13.5416 2 12.4277 2ZM8.67773 12C8.67773 9.92893 10.3567 8.25 12.4277 8.25C14.4988 8.25 16.1777 9.92893 16.1777 12C16.1777 14.0711 14.4988 15.75 12.4277 15.75C10.3567 15.75 8.67773 14.0711 8.67773 12Z" clip-rule="evenodd"/></svg></button>
            <button class="ctl-btn primary drop-trigger" id="paletteToggleBtn" onclick="togglePaletteRow()" title="配色面板" aria-label="配色面板"><svg id="paletteToggleIcon" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.61-.23-1.2-.64-1.67a.53.53 0 0 1-.13-.33c0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6c0-4.96-4.49-9-10-9m5.5 11c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5m-3-4c-.83 0-1.5-.67-1.5-1.5S13.67 6 14.5 6s1.5.67 1.5 1.5S15.33 9 14.5 9M5 11.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S7.33 13 6.5 13S5 12.33 5 11.5m6-4c0 .83-.67 1.5-1.5 1.5S8 8.33 8 7.5S8.67 6 9.5 6s1.5.67 1.5 1.5"/></svg></button>
            <button class="ctl-btn primary drop-trigger" id="debugToggleBtn" onclick="toggleDebugPanel()" title="调试面板" aria-label="调试面板"><svg viewBox="0 0 32 32" fill="currentColor" style="flex-shrink:0"><path d="m29.83 20l.34-2l-5.17-.85v-4.38l5.06-1.36l-.51-1.93l-4.83 1.29A9 9 0 0 0 20 5V2h-2v2.23a8.8 8.8 0 0 0-4 0V2h-2v3a9 9 0 0 0-4.71 5.82L2.46 9.48L2 11.41l5 1.36v4.38L1.84 18l.32 2L7 19.18a8.9 8.9 0 0 0 .82 3.57l-4.53 4.54l1.42 1.42l4.19-4.2a9 9 0 0 0 14.2 0l4.19 4.2l1.42-1.42l-4.54-4.54a8.9 8.9 0 0 0 .83-3.57ZM15 25.92A7 7 0 0 1 9 19v-6h6ZM9.29 11a7 7 0 0 1 13.42 0ZM23 19a7 7 0 0 1-6 6.92V13h6Z"/></svg></button>
          </div>
          <input type="file" id="midiFile" accept=".mid,.midi" style="display:none" onchange="onMidiFile(event)">
          <div id="paletteRow" class="palette-row drop-panel">
            <div class="pal-col">
              <div class="pal-grid">
              <button class="pal-btn palette-btn" data-palette="A" onclick="setPalette('A')" title="纯紫">A</button>
              <button class="pal-btn palette-btn active" data-palette="B" onclick="setPalette('B')" title="青蓝×琥珀红">B</button>
              <button class="pal-btn palette-btn" data-palette="C" onclick="setPalette('C')" title="青绿×品红">C</button>
              <button class="pal-btn" id="paletteEditBtn" onclick="togglePaletteEditor()" title="自定义配色">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M8.203 2.004c1.261 0 2.304 1.103 2.476 2.538l8.483 8.484l-7.778 7.778a3 3 0 0 1-4.243 0L2.9 16.562a3 3 0 0 1 0-4.243l2.804-2.805V4.961c0-1.633 1.12-2.957 2.5-2.957m.5 2.957v1.553l-1 1V4.961c0-.327.224-.591.5-.591c.277 0 .5.264.5.591m0 5.914V9.342l-4.39 4.391a1 1 0 0 0 0 1.414l4.243 4.243a1 1 0 0 0 1.414 0l6.364-6.364l-5.63-5.63v3.48l-.003.128h-2.01a1 1 0 0 0 .012-.129" clip-rule="evenodd"/><path d="M16.859 16.875a3 3 0 1 0 4.242 0l-2.121-2.121z"/></svg>
              </button>
              </div>
              <div class="pal-hint">无操作2s自动收起配色面板</div>
            </div>
            <div id="paletteSwatch" style="flex:1 1 0;min-width:0;max-width:340px;height:44px;position:relative;"></div>
            <div id="paletteEditor" class="palette-editor">
              <div class="palette-head">
                <h3>自定义配色</h3>
                <button type="button" id="paletteThemeBtn" class="palette-theme-btn" onclick="selectPaletteTarget('theme')" title="主题色（按钮/按键遮罩/开关/滑块）">
                  <span class="sw" id="paletteThemeSwatch"></span><span>主题色</span>
                </button>
              </div>
              <div id="paletteEndpoints"></div>
              <div class="palette-preset-row">
                <span class="pp-title">常用</span>
                <div id="palettePresets" class="palette-presets"></div>
              </div>
              <div class="palette-colors">
                <div class="palette-board-wrap">
                  <canvas id="colorBoard" width="240" height="140"></canvas>
                  <span id="colorBoardMarker" class="color-board-marker"></span>
                </div>
                <div class="hsl-sliders">
                  <span class="hsl-label">色相</span>
                  <div class="hsl-slider" data-hsl="h"><span class="hsl-handle" id="hslHandleH"></span></div>
                  <span class="hsl-label">饱和度</span>
                  <div class="hsl-slider" data-hsl="s"><span class="hsl-handle" id="hslHandleS"></span></div>
                  <span class="hsl-label">亮度</span>
                  <div class="hsl-slider" data-hsl="l"><span class="hsl-handle" id="hslHandleL"></span></div>
                  <span class="hsl-label">透明度</span>
                  <div class="hsl-slider" data-hsl="a"><span class="hsl-handle" id="hslHandleA"></span></div>
                </div>
              </div>
              <div class="palette-foot">
                <span>正在设置：<b id="palettePickLabel" style="color:#fff">主题色</b></span>
                <span style="display:flex;align-items:center;gap:5px;">当前<span id="palettePickPreview"></span></span>
              </div>
            </div>
          </div>
          <div class="debug-panel drop-panel" id="debugPanel">
            <div class="dbg-header">
              <div class="dbg-toolbar">
                <label class="switch"><input id="dbgEnabled" type="checkbox" checked onchange="onDebugEnabledChange()"><span class="track"><span class="knob"></span></span>启用调试</label>
                <button class="dbg-reset-btn" id="debugResetBtn" onclick="confirmResetAll()" title="重置所有设置"><span>重置所有选项</span><svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.854 2.646a.5.5 0 0 1 0 .708L4.207 5H11a6 6 0 1 1-6 6a.5.5 0 0 1 1 0a5 5 0 1 0 5-5H4.207l1.647 1.646a.5.5 0 1 1-.708.708l-2.5-2.5a.5.5 0 0 1 0-.708l2.5-2.5a.5.5 0 0 1 .708 0"/></svg></button>
                <button class="dbg-reset-btn" id="debugClearBtn" onclick="confirmClearDebug()" title="清空日志"><span>清空日志</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m-6 5v6m4-6v6"/></svg></button>
              </div>
              <div class="dbg-off-hint">调试已关闭，无日志采集与监控。</div>
              <div class="dbg-body">
                <div class="dbg-actions">
                  <label class="switch">
                    <input id="dbgAutoOpen" type="checkbox" checked onchange="onDbgAutoOpenChange()">
                    <span class="track"><span class="knob"></span></span>渲染降级自动弹出
                  </label>
                  <button class="dbg-icon-btn" id="debugCopyBtn" onclick="copyDebugTerminal()" title="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                  <button class="dbg-icon-btn" onclick="downloadDebugLog()" title="下载日志"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5l5 5l5-5m-5 5V3"/></svg></button>
                  <button class="dbg-icon-btn" onclick="scrollDebugTop()" title="顶部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15l-6-6l-6 6"/></svg></button>
                  <button class="dbg-icon-btn" onclick="scrollDebugBottom()" title="底部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9l6 6l6-6"/></svg></button>
                </div>
              </div>
            </div>
            <div id="debugTerminalContent" class="dbg-log"></div>
          </div>
          <!-- 左侧控制面板（仅设置项） -->
          <div class="panel control-panel drop-panel" id="controlPanel">
            <div class="dbg-section" id="appearanceSection">
              <div class="dbg-toolbar">
                <div class="appearance-sliders">
                  <label title="面板透明度">透明 <input id="panelTransparency" type="range" min="0" max="100" step="5" value="40" oninput="applyPanelAppearance()"> <span class="pct" id="transparencyPct">40%</span></label>
                  <label title="面板背景模糊">模糊 <input id="panelBlur" type="range" min="0" max="100" step="5" value="0" oninput="applyPanelAppearance()"> <span class="pct" id="blurPct">0%</span></label>
                </div>
                <label class="switch" title="欣赏模式：音符自动发声；音游模式：需点击琴键发声" style="margin-left:auto">
                  <input id="playModeSw" type="checkbox" checked onchange="onPlayModeChange()">
                  <span class="track"><span class="knob"></span></span>
                  <span id="playModeLabel">欣赏模式</span>
                </label>
              </div>
            </div>
            <div class="row">
              <label>音乐倍速</label>
              <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" oninput="onSpeedChange()">
              <span class="val" id="speedVal">1.0x</span>
            </div>
            <div class="row">
              <label>下落流速</label>
              <input type="range" id="fallSpeedSlider" min="0.2" max="5" step="0.1" value="1" oninput="onFallSpeedChange()">
              <span class="val" id="fallSpeedVal">1.0x</span>
            </div>
            <div class="row">
              <label>钢琴高度</label>
              <input type="range" id="pianoHeightSlider" min="5" max="50" step="1" value="25" oninput="onPianoHeightChange()">
              <span class="val" id="pianoHeightVal">25%</span>
            </div>
            <div class="row">
              <label>宽度缩放</label>
              <input type="range" id="pianoWidthSlider" min="1" max="4" step="0.001" value="1" oninput="onPianoWidthChange()">
              <span class="val" id="pianoWidthVal">1.0×</span>
            </div>
            <div class="row">
              <label>水平偏移</label>
              <input type="range" id="pianoOffsetSlider" min="0" max="100" step="0.01" value="0" oninput="onPianoOffsetChange()">
              <span class="val" id="pianoOffsetVal">0%</span>
            </div>
            <div class="row">
              <label>键数版型</label>
              <input type="range" id="keyboardPresetSlider" min="0" max="6" step="1" value="6" oninput="onKeyboardPresetChange()">
              <span class="val" id="keyboardPresetVal">88键</span>
            </div>
            <div class="row">
              <label title="开：所有镜像同时完整下载，最快完成者胜出；关：仅竞速首字节响应">完整下载竞速</label>
              <label class="switch" style="margin-left:auto">
                <input id="raceFullSw" type="checkbox" checked onchange="onRaceFullChange()">
                <span class="track"><span class="knob"></span></span>
              </label>
            </div>
            <div class="row">
              <label>音色选择</label>
              <select id="timbreSel" onchange="onTimbreChange()">
                <option value="__synth__">合成钢琴</option>
                <optgroup label="键盘">
                  <option value="acoustic_grand_piano">三角钢琴</option>
                  <option value="bright_acoustic_piano">亮音钢琴</option>
                  <option value="electric_grand_piano">电三角钢琴</option>
                  <option value="electric_piano_1">电钢琴1</option>
                  <option value="electric_piano_2">电钢琴2</option>
                  <option value="honkytonk_piano">酒吧钢琴</option>
                  <option value="harpsichord">大键琴</option>
                  <option value="clavinet" selected>古钢琴</option>
                </optgroup>
                <optgroup label="风琴/打击">
                  <option value="drawbar_organ">拉杆风琴</option>
                  <option value="percussive_organ">打击风琴</option>
                  <option value="rock_organ">摇滚风琴</option>
                  <option value="church_organ">教堂管风琴</option>
                  <option value="celesta">钢片琴</option>
                  <option value="vibraphone">颤音琴</option>
                  <option value="marimba">马林巴</option>
                  <option value="xylophone">木琴</option>
                  <option value="tubular_bells">管钟</option>
                </optgroup>
                <optgroup label="吉他/贝斯">
                  <option value="acoustic_guitar_nylon">古典吉他</option>
                  <option value="acoustic_guitar_steel">民谣吉他</option>
                  <option value="electric_guitar_jazz">爵士电吉他</option>
                  <option value="electric_guitar_clean">清音电吉他</option>

<script id="appLoader">
(function(){
  /* 入口重代码（app.css/app.js）优先同源加载：与 HTML 同版本、绝不吃 CDN 陈旧缓存；
     同源失败才回退 jsDelivr。no-cache 强制校验（未变则 304），加载后注入并显示内容。 */
  var CDN='https://cdn.jsdelivr.net/gh/teecatt/teecatt.github.io@master/midi_player/';
  function reveal(){
    try{
      var el=document.getElementById('appLoading');
      if(el && el.parentNode) el.parentNode.removeChild(el);
      document.body.style.visibility='visible';
    }catch(e){}
  }
  function fallback(){
    try{
      var l=document.createElement('link'); l.rel='stylesheet'; l.href='app.css'; document.head.appendChild(l);
      var s=document.createElement('script'); s.src='app.js'; document.body.appendChild(s);
    }catch(e){}
    reveal();
  }
  function load(url){
    return fetch(url, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); });
  }
  function loadWithFallback(f){
    return load(f).catch(function(){ return load(CDN+f); });
  }
  function inject(css,js){
    var st=document.createElement('style'); st.textContent=css+'\n/*# sourceURL=app.css */'; document.head.appendChild(st);
    var sc=document.createElement('script'); sc.textContent=js+'\n//# sourceURL=app.js'; document.body.appendChild(sc);
    reveal();
  }
  try{
    Promise.all([loadWithFallback('app.css'), loadWithFallback('app.js')]).then(
      function(r){ inject(r[0], r[1]); },
      fallback
    );
    setTimeout(reveal, 8000); // 兜底：无论成功与否 8s 后显示
  }catch(e){ fallback(); }
})();
</script>
