<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI 播放器 · 88键可视化</title>
<style>
:root{
  --bg:#0d0d14; --panel:#16161f; --border:#2a2a3a; --text:#e8e8f0;
  --dim:#8a8aa0; --accent:#8b5cf6; --accent2:#6366f1; --ok:#2fbf6f; --warn:#e8b64c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.container{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:13px;margin-bottom:16px}
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .container{padding:0}
  h1,.subtitle{display:none}
}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.panel h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}

/* 菜单按钮（左侧边缘，可拖拽，自动淡出） */
.menu-btn{
  display:none;
  position:fixed;left:0;top:66.67%;transform:translateY(-50%);
  z-index:2001;
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(22,22,31,.85);border:1px solid var(--border);
  color:var(--text);font-size:18px;cursor:grab;
  align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  touch-action:none;user-select:none;
  transition:opacity .4s ease, transform .4s ease, left .3s ease;
  opacity:1;
}
.menu-btn.faded{opacity:0.5}
.menu-btn:active{cursor:grabbing}
.menu-btn.hidden-btn{display:none !important}
@media(max-width:800px){.menu-btn{display:flex}}

/* 移动端抽屉面板 */
@media(max-width:800px){
  .control-panel{
    position:fixed;top:0;left:0;z-index:1000;
    width:100vw;max-height:66.67vh;
    overflow-y:auto;
    border-radius:0 0 16px 16px;
    transform:translateX(-105%);
    transition:transform .25s ease;
    box-shadow:4px 0 20px rgba(0,0,0,.5);
  }
  .control-panel.open{transform:translateX(0)}
  /* 右侧容器固定全屏 */
  .layout > div:last-child{
    position:fixed;inset:0;display:flex;flex-direction:column;
  }
  .top-bar{flex-shrink:0}
  .visual-panel{
    flex:1;border-radius:0;border:none;padding:0;
    min-height:0;position:relative;
  }
  #visualCanvas{height:100% !important;border-radius:0}
  .overlay-mask{
    display:none;position:fixed;inset:0;z-index:999;
    background:rgba(0,0,0,.4);
  }
  .overlay-mask.show{display:block}
}

/* 失焦暂停遮罩 */
.pause-overlay{
  display:none;position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.pause-overlay.show{display:flex}
.pause-overlay .pause-title{font-size:20px;font-weight:600;color:var(--text)}
.pause-overlay .pause-desc{font-size:14px;color:var(--dim)}
.pause-overlay .pause-btn{
  padding:14px 36px;font-size:16px;font-weight:600;
  background:var(--accent);border:none;border-radius:10px;color:#fff;
  cursor:pointer;transition:transform .1s;
}
.pause-overlay .pause-btn:hover{transform:scale(1.05)}
.pause-overlay .pause-btn:active{transform:scale(0.98)}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;min-height:40px}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#7c3aed}
.btn:disabled{opacity:.4;cursor:not-allowed}
.speed-btn{border-radius:10px !important;border:none !important;background:rgba(124,58,237,.15) !important;color:#c4b5fd !important}
.speed-btn.active{background:var(--accent) !important;color:#fff !important;font-weight:600}
.speed-btn:hover{background:rgba(124,58,237,.3) !important}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* 顶部控制栏（可视化区上方） */
.top-bar{
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:8px 10px;margin-bottom:8px;
}
.top-bar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top-bar .btn{padding:4px 6px;min-height:28px;font-size:11px;border-radius:10px;border:none;white-space:nowrap;flex-shrink:0}
.top-bar .top-bar-row:nth-child(2) .btn:nth-child(1),.top-bar .top-bar-row:nth-child(2) .btn:nth-child(2){width:52px;flex:0 0 52px}
.top-bar select{padding:4px 8px;font-size:12px;border-radius:10px;width:140px;flex:0 0 auto;flex-shrink:0;min-height:28px}
.top-bar .song-name{font-size:11px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.top-bar .progress-wrap{margin:4px 0 0}
.top-bar .progress-bar{height:8px}
.top-bar .time-row{font-size:11px;margin-top:2px}
@media(max-width:800px){
  .top-bar{border-radius:0;border-left:none;border-right:none;border-top:none;margin-bottom:0}
}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{font-size:12px;color:var(--dim);min-width:60px}
.row input[type=range]{flex:1;accent-color:var(--accent);height:8px;border-radius:4px;cursor:pointer}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.row input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
.row input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.row input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.1)}
.row .val{font-size:12px;color:var(--text);min-width:40px;text-align:right}
select{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;cursor:pointer}
select:focus{border-color:var(--accent)}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.progress-wrap{margin:12px 0}
.progress-bar{height:6px;background:#e5e5e5;border-radius:3px;overflow:hidden;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
#visualCanvas{width:100%;height:500px;background:#0a0a10;border-radius:8px;display:block}
.file-info{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.file-info b{color:var(--text)}
.timbre-hint{font-size:11px;color:var(--dim);margin-top:4px;min-height:16px}
</style>
</head>
<body>

<button class="menu-btn" onclick="toggleMenu()">☰</button>
<!-- 移动端遮罩 -->
<div class="overlay-mask" id="overlayMask" onclick="toggleMenu()"></div>
<!-- 失焦暂停遮罩 -->

<div class="container">
  <h1>MIDI 播放器</h1>

<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script>
/* ============================================================
 * 1. 音频上下文
 * ========================================================== */
let audioCtx = null;
let masterGain = null;

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.7;
  masterGain.connect(audioCtx.destination);
}

/* ============================================================
 * 2. 音色加载器（Soundfont + Cache API）
 * ========================================================== */
// 静态资源缓存（MIDI谱、list.json等），版本化缓存名
const AssetCache = {
  cacheName: 'midi-player-assets-v1',
  async fetch(url) {
    try {
      const cache = await caches.open(this.cacheName);
      const cached = await cache.match(url);
      if (cached) return cached.clone();
      const resp = await fetch(url);
      if (resp.ok) cache.put(url, resp.clone());
      return resp;
    } catch(e) {
      return fetch(url); // Cache API不可用时回退普通fetch
    }
  }
};

const SoundfontLoader = {
  cacheName: 'midi-player-soundfont-cache-v1',
  cdnBase: 'https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@master/FluidR3_GM/',
  loaded: {},
  current: '__synth__',
  loading: null,
  noteToMidi: {},
  activeSources: new Array(109).fill(null),
  timbreGain: { 'acoustic_grand_piano': 10.0, 'clavinet': 5.0 }, // 硬编码音色增益：三角钢琴1000%, 古钢琴500%
  lastTriggerTime: new Array(109).fill(0),
  MIN_TRIGGER_INTERVAL: 0.05, // 同音最小触发间隔50ms（解析时已合并，此为兜底）
  MIN_DURATION: 0.03, // 最小播放时间30ms
  activeSources: new Array(109).fill(null),
  timbreGain: { 'acoustic_grand_piano': 10.0, 'clavinet': 5.0 }, // 硬编码音色增益：三角钢琴1000%, 古钢琴500%
  lastTriggerTime: new Array(109).fill(0),
  MIN_TRIGGER_INTERVAL: 0.05, // 同音最小触发间隔50ms（解析时已合并，此为兜底）
  MIN_DURATION: 0.03, // 最小播放时间30ms // 每个midi音当前活跃的节点

  init(){
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    for(let oct = 0; oct <= 8; oct++){
      for(let i = 0; i < 12; i++){
        const midi = oct * 12 + i + 12;
        if(midi >= 21 && midi <= 108) this.noteToMidi[names[i] + oct] = midi;
      }
    }
  },

  async load(name, onProgress){
    if(name === '__synth__'){ this.current = '__synth__'; return; }
    if(this.loaded[name] && this.loaded[name].ready){ this.current = name; return; }
    if(this.loading) await this.loading;
    this.loading = this._doLoad(name, onProgress);
    await this.loading;
    this.loading = null;
    this.current = name;
  },

  async _doLoad(name, onProgress){
    const url = this.cdnBase + name + '-ogg.js';
    if(onProgress) onProgress(0, '正在下载音色…');
    let text = null;
    try{
      const cache = await caches.open(this.cacheName);
      const cached = await cache.match(url);
      if(cached){ text = await cached.text(); if(onProgress) onProgress(0.5, '从缓存读取音色…'); }
    }catch(e){}
    if(!text){
      const resp = await fetch(url, {mode: 'cors'});
      if(!resp.ok) throw new Error('下载失败 HTTP ' + resp.status);
      text = await resp.text();
      try{ const cache = await caches.open(this.cacheName); await cache.put(url, new Response(text, {headers:{'Content-Type':'application/javascript'}})); }catch(e){}
      if(onProgress) onProgress(0.5, '下载完成，解析中…');
    }
    const MIDI = { Soundfont: {} };
    const fn = new Function('MIDI', text + '\nreturn MIDI.Soundfont["' + name + '"];');
    const raw = fn(MIDI);
    if(!raw) throw new Error('音色数据解析失败');
    this.loaded[name] = { raw: raw, buffers: {}, ready: true };
    if(onProgress) onProgress(1, '音色加载完成');
  },

  async _getBuffer(name, midi){
    const entry = this.loaded[name];
    if(!entry) return null;
    if(entry.buffers[midi]) return entry.buffers[midi];
    const noteName = this._midiToNote(midi);
    let dataUri = entry.raw[noteName];
    if(!dataUri){
      let bestDist = 999, bestKey = null;
      for(const k in entry.raw){
        const m = this.noteToMidi[k];
        if(m && Math.abs(m - midi) < bestDist){ bestDist = Math.abs(m - midi); bestKey = k; }
      }
      if(bestKey) dataUri = entry.raw[bestKey];
    }
    if(!dataUri) return null;
    const base64 = dataUri.split(',')[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const buffer = await audioCtx.decodeAudioData(bytes.buffer);
    entry.buffers[midi] = buffer;
    return buffer;
  },

  _midiToNote(midi){
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    return names[midi % 12] + Math.floor(midi / 12 - 1);
  },

  // 预解码当前音色的所有88个音
  async predecodeAll(){
    if(this.current === '__synth__') return;
    // 分批解码，每批8个，避免同时解码88个导致主线程阻塞、音频时间线暂停
    const batchSize = 8;
    const midis = [];
    for(let midi = 21; midi <= 108; midi++) midis.push(midi);
    for(let i = 0; i < midis.length; i += batchSize){
      const batch = midis.slice(i, i + batchSize);
      await Promise.all(batch.map(m => this._getBuffer(this.current, m)));
    }
  },

  // 并发预加载所有音色（直接调用_doLoad绕过单加载锁，自动缓存）
  async preloadAll(onProgress){
    const sel = document.getElementById('timbreSel');
    const allNames = [];
    for(let i = 0; i < sel.options.length; i++){
      const v = sel.options[i].value;
      if(v !== '__synth__') allNames.push(v);
    }
    // 优先加载的音色
    const priority = ['clavinet', 'acoustic_grand_piano'];
    const rest = allNames.filter(n => !priority.includes(n));
    let done = 0;
    const total = allNames.length;
    // 先加载优先音色（串行，确保立即可用）
    for(const name of priority){
      if(!this.loaded[name] || !this.loaded[name].ready){
        try{ await this._doLoad(name, null); }catch(e){}
      }
      done++;
      if(onProgress) onProgress(done/total, '预加载音色 ' + done + '/' + total);
    }
    // 并发加载其余音色（每批4个并发）
    const batchSize = 4;
    for(let i = 0; i < rest.length; i += batchSize){
      const batch = rest.slice(i, i + batchSize);
      await Promise.all(batch.map(async name => {
        if(!this.loaded[name] || !this.loaded[name].ready){
          try{ await this._doLoad(name, null); }catch(e){}
        }
      }));
      done += batch.length;
      if(onProgress) onProgress(done/total, '预加载音色 ' + done + '/' + total);
    }
  },

  // 停止所有正在播放的音符（切换音色时调用）
  stopAll(){
    const t = audioCtx ? audioCtx.currentTime : 0;
    for(let i = 0; i < this.activeSources.length; i++){
      const s = this.activeSources[i];
      if(s){
        try{
          s.gain.gain.cancelScheduledValues(t);
          s.gain.gain.setValueAtTime(s.gain.gain.value, t);
          s.gain.gain.linearRampToValueAtTime(0, t + 0.01);
          s.src.stop(t + 0.02);
        }catch(e){}
        this.activeSources[i] = null;
      }
    }
    this.lastTriggerTime.fill(0);
  },

  playNote(midi, velocity, duration){
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    // 同音节流：30ms内的重复触发忽略，人耳分辨不出
    if(t - this.lastTriggerTime[midi] < this.MIN_TRIGGER_INTERVAL) return;
    this.lastTriggerTime[midi] = t;
    // 最小播放时间30ms，避免极短音符频繁切换
    const effDuration = Math.max(duration, this.MIN_DURATION);
    if(this.current !== '__synth__'){
      const entry = this.loaded[this.current];
      const buffer = entry ? entry.buffers[midi] : null;
      if(buffer){
        // 同音新音符触发：打断上一个，10ms快速淡出
        const prev = this.activeSources[midi];
        if(prev){
          try{
            prev.gain.gain.cancelScheduledValues(t);
            prev.gain.gain.setValueAtTime(prev.gain.gain.value, t);
            prev.gain.gain.linearRampToValueAtTime(0, t + 0.01);
            prev.src.stop(t + 0.02);
          }catch(e){}
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const g = audioCtx.createGain();
        const release = 0.02;
        const tg = this.timbreGain[this.current] || 3.0; // 未配置的音色默认300%增益
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.4 * velocity * tg, t + 0.005);
        g.gain.setValueAtTime(0.4 * velocity * tg, t + Math.max(0.01, effDuration - release));
        g.gain.linearRampToValueAtTime(0, t + effDuration);
        src.connect(g); g.connect(masterGain);
        src.start();
        src.stop(t + effDuration + 0.05);
        this.activeSources[midi] = {src, gain: g};
        src.onended = () => {
          if(this.activeSources[midi] && this.activeSources[midi].src === src) this.activeSources[midi] = null;
        };
        return;
      }
      // buffer未就绪时回退合成钢琴
    }
    // 回退：合成钢琴
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const t0 = audioCtx.currentTime;
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0, t0);
    env.gain.linearRampToValueAtTime(0.4 * velocity, t0 + 0.008);
    env.gain.exponentialRampToValueAtTime(0.0008, t0 + duration);
    env.connect(masterGain);
    const specs = [[1, 0.9, "triangle"], [2, 0.35, "sine"], [3, 0.18, "sine"]];
    for(const [mult, amp, wf] of specs){
      const o = audioCtx.createOscillator();
      o.type = wf; o.frequency.value = f * mult;
      const g = audioCtx.createGain(); g.gain.value = amp;
      o.connect(g); g.connect(env);
      o.start(t0); o.stop(t0 + duration + 0.2);
    }
  }
};

// IndexedDB：存储用户上传的 MIDI
const DB_NAME = 'midi-player-db';
const STORE = 'user-songs';
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains(STORE)){
        req.result.createObjectStore(STORE, {keyPath: 'name'});
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveUserSong(name, buf){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({name, data: buf});
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getUserSongs(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function deleteUserSong(name){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(name);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getUserSong(name){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(name);
    req.onsuccess = () => resolve(req.result ? req.result.data : null);
    req.onerror = () => reject(req.error);
  });
}

// 通用：解析MIDI并准备播放
function parseAndPlayMidi(buf, filename){
  const midi = new Midi(buf);
  midiData = midi;
  allNotes = [];
  let maxTime = 0;
  midi.tracks.forEach(track => {
    track.notes.forEach(note => {
      allNotes.push({midi: note.midi, time: note.time, duration: note.duration, velocity: note.velocity});
      if(note.time + note.duration > maxTime) maxTime = note.time + note.duration;
    });
  });
  allNotes.sort((a, b) => a.time - b.time);
  totalDuration = maxTime;
  document.getElementById('statTracks').textContent = '轨道：' + midi.tracks.length;
  document.getElementById('statTotal').textContent = '音符：' + allNotes.length;
  document.getElementById('statPlayed').textContent = '已播：0/' + allNotes.length;
  document.getElementById('statPercent').textContent = '0.00%';
  document.getElementById('playBtn').disabled = false;
  document.querySelector('button[onclick="replayPlay()"]').disabled = false;
  document.getElementById('loopBtn').disabled = false;
  document.getElementById('totalTime').textContent = formatTime(totalDuration);
  currentTime = 0;
  nextNoteIndex = 0;
  updateProgress();
  drawScene([], 0);
}

let midiData = null;
let allNotes = []; // {midi, time, duration, velocity}
let totalDuration = 0;

function onMidiFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      stopPlay();
      const buf = e.target.result;
      parseAndPlayMidi(buf, file.name);
      // 上传后自动播放，关闭失焦遮罩
      document.getElementById('pauseOverlay').classList.remove('show');
      wasPlayingBeforeBlur = false;
      initAudio();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      startPlay();
      // 保存到 IndexedDB 并刷新播放列表
      try{
        await saveUserSong(file.name, buf);
        await loadSongList();

        // 选中刚上传的
        const sel = document.getElementById('songSel');
        for(let i=0;i<sel.options.length;i++){
          if(sel.options[i].value === 'user:' + file.name){
            sel.selectedIndex = i; break;
          }
        }
      }catch(err){
        console.warn('保存到本地缓存失败:', err);
      }
    }catch(err){
      document.getElementById('fileInfo').textContent = '解析失败：' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

/* ============================================================
 * 4. 播放控制
 * ========================================================== */
let isPlaying = false;
let lastStatUpdate = 0;
let currentTime = 0;
let playStartTime = 0;
let playSpeed = 1;
let nextNoteIndex = 0;
let rafId = null;
let activeNotes = [];
const activeKeySet = new Set();
let loopEnabled = false;

function togglePlay(){
  initAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(isPlaying){
    pausePlay();
  } else {
    startPlay();
  }
}

function startPlay(){
  if(!allNotes.length) return;
  isPlaying = true;
  playStartTime = audioCtx.currentTime - currentTime / playSpeed;
  nextNoteIndex = allNotes.findIndex(n => n.time >= currentTime);
  if(nextNoteIndex === -1) nextNoteIndex = allNotes.length;
  document.getElementById('playBtn').textContent = '⏸ 暂停';
  rafId = requestAnimationFrame(playLoop);
}

function pausePlay(){
  isPlaying = false;
  if(rafId) cancelAnimationFrame(rafId);
  currentTime = (audioCtx.currentTime - playStartTime) * playSpeed;
  document.getElementById('playBtn').textContent = '▶ 播放';
}

function stopPlay(){
  isPlaying = false;
  if(rafId) cancelAnimationFrame(rafId);
  currentTime = 0;
  nextNoteIndex = 0;
  activeNotes = [];
  document.getElementById('playBtn').textContent = '▶ 播放';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('curTime').textContent = '0:00';
  if(allNotes.length > 0){
    document.getElementById('statPlayed').textContent = '已播：0/' + allNotes.length;
    document.getElementById('statPercent').textContent = '0.00%';
  }
  drawScene([]);
}

function replayPlay(){
  stopPlay();
  setTimeout(() => startPlay(), 50);
}

function toggleLoop(){
  loopEnabled = !loopEnabled;
  const btn = document.getElementById('loopBtn');

// 菜单按钮：拖拽 + 自动淡出
(function(){
  const btn = document.querySelector('.menu-btn');
  if(!btn) return;
  let fadeTimer = null;
  function showMenuBtn(){
    btn.classList.remove('faded');
    if(fadeTimer) clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => btn.classList.add('faded'), 2000);
  }
  window.showMenuBtn = showMenuBtn;
  // 初始显示，1秒后淡出
  showMenuBtn();
  // 页面任意交互时显现
  document.addEventListener('touchstart', () => { if(!btn.classList.contains('hidden-btn')) showMenuBtn(); }, {passive:true});
  document.addEventListener('mousemove', () => { if(!btn.classList.contains('hidden-btn')) showMenuBtn(); });

  const saved = localStorage.getItem('menuBtnPos');
  if(saved){
    try{
      const pos = JSON.parse(saved);
      btn.style.left = pos.x + 'px';
      btn.style.top = pos.y + 'px';
      btn.style.right = 'auto';
      btn.style.transform = 'none';
    }catch(e){}
  }
  let isDragging = false, moved = false;
  let startX, startY, startLeft, startTop;
  function onDown(e){
    isDragging = true; moved = false;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    startLeft = btn.offsetLeft; startTop = btn.offsetTop;
    btn.style.transition = 'none'; // 拖动时禁用过渡，确保跟手
    btn.classList.remove('faded'); // 拖动时保持不透明
    if(fadeTimer) clearTimeout(fadeTimer);
    e.preventDefault();
  }
  function onMove(e){
    if(!isDragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    let nl = Math.max(0, Math.min(window.innerWidth - btn.offsetWidth, startLeft + dx));
    let nt = Math.max(0, Math.min(window.innerHeight - btn.offsetHeight, startTop + dy));
    btn.style.left = nl + 'px'; btn.style.top = nt + 'px'; btn.style.right = 'auto';
    btn.style.transform = 'none';
    e.preventDefault();
  }
  function onUp(){
    if(!isDragging) return;
    isDragging = false;
    if(moved){
      // 恢复transition用于吸附动画
      btn.style.transition = '';
      // 自动吸附左右侧：以屏幕中轴线为分界
      const centerX = btn.offsetLeft + btn.offsetWidth / 2;
      const screenCenter = window.innerWidth / 2;
      let snapX;
      if(centerX < screenCenter){
        snapX = 4;
      } else {
        snapX = window.innerWidth - btn.offsetWidth - 4;
      }
      btn.style.left = snapX + 'px';
      localStorage.setItem('menuBtnPos', JSON.stringify({x: snapX, y: btn.offsetTop}));
      showMenuBtn();
    } else {
      btn.style.transition = '';
      toggleMenu();
    }
  }
  btn.addEventListener('mousedown', onDown);
  btn.addEventListener('touchstart', onDown, {passive:false});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
})();

// 失焦自动暂停
let wasPlayingBeforeBlur = false;
let blurPauseEnabled = true;
document.addEventListener('visibilitychange', () => {
  if(document.hidden && blurPauseEnabled){
    if(isPlaying){
      wasPlayingBeforeBlur = true;
      pausePlay();
      document.getElementById('pauseOverlay').classList.add('show');
    }
  }
});

function onBlurPauseToggle(){
  blurPauseEnabled = document.getElementById('blurPauseToggle').checked;
  localStorage.setItem('blurPauseEnabled', blurPauseEnabled ? '1' : '0');
}
// 恢复设置：移动端默认开启，PC端默认关闭
(function(){
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth <= 800;
  const saved = localStorage.getItem('blurPauseEnabled');
  if(saved !== null){
    // 用户有手动设置，优先用用户设置
    blurPauseEnabled = saved === '1';
  } else {
    // 无设置时按设备默认
    blurPauseEnabled = isMobile;
  }
  document.getElementById('blurPauseToggle').checked = blurPauseEnabled;
})();

function resumeFromPause(){
  document.getElementById('pauseOverlay').classList.remove('show');
  if(wasPlayingBeforeBlur && totalDuration > 0){
    initAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    startPlay();
  }
  wasPlayingBeforeBlur = false;
}

// 进度条拖拽
let isSeeking = false;
function startSeek(event){
  if(!totalDuration) return;
  isSeeking = true;
  event.preventDefault();
  doSeek(event);
  document.addEventListener('mousemove', doSeek);
  document.addEventListener('mouseup', endSeek);
  document.addEventListener('touchmove', doSeek, {passive:false});
  document.addEventListener('touchend', endSeek);
}
function doSeek(event){
  if(!totalDuration) return;
  event.preventDefault();
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  currentTime = pct * totalDuration;
  if(isPlaying){
    playStartTime = audioCtx.currentTime - currentTime / playSpeed;
    nextNoteIndex = allNotes.findIndex(n => n.time >= currentTime);
    if(nextNoteIndex === -1) nextNoteIndex = allNotes.length;
  }
  updateProgress();
  // 拖拽时也更新可视化
  const fallDur = 2.0 / fallSpeedMultiplier;
  const visibleNotes = allNotes.filter(n =>
    n.time + n.duration > currentTime - 0.1 && n.time < currentTime + fallDur
  );
  drawScene(visibleNotes, currentTime);
}
function endSeek(){
  isSeeking = false;
  document.removeEventListener('mousemove', doSeek);
  document.removeEventListener('mouseup', endSeek);
  document.removeEventListener('touchmove', doSeek);
  document.removeEventListener('touchend', endSeek);
}

function setSpeed(speed){
  playSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === speed);
  });
  if(isPlaying){
    playStartTime = audioCtx.currentTime - currentTime / playSpeed;
  }
}

let fallSpeedMultiplier = 1.0;
function onFallSpeedChange(){
  fallSpeedMultiplier = parseFloat(document.getElementById('fallSpeedSlider').value);
  document.getElementById('fallSpeedVal').textContent = fallSpeedMultiplier.toFixed(1) + 'x';
}

function onVolChange(){
  const v = parseFloat(document.getElementById('volSlider').value);
  document.getElementById('volVal').textContent = Math.round(v * 100) + '%';
  if(masterGain) masterGain.gain.value = v;
}

// 二分查找：第一个 time >= target 的索引
function lowerBound(arr, target){
  let lo = 0, hi = arr.length;
  while(lo < hi){
    const mid = (lo + hi) >> 1;
    if(arr[mid].time < target) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function playLoop(){
  if(!isPlaying) return;
  const now = audioCtx.currentTime;
  currentTime = (now - playStartTime) * playSpeed;

  // 触发到时间的音符（同一帧同音合并，最多88个同时触发）
  const triggeredThisFrame = new Set();
  while(nextNoteIndex < allNotes.length && allNotes[nextNoteIndex].time <= currentTime){
    const note = allNotes[nextNoteIndex];
    if(!triggeredThisFrame.has(note.midi)){
      triggeredThisFrame.add(note.midi);
      SoundfontLoader.playNote(note.midi, note.velocity, note.duration / playSpeed);
    }
    nextNoteIndex++;
  }

  // 计算可见音符范围：二分查找定位区间，不slice（避免大数组分配）
  const fallDuration = 2.0 / fallSpeedMultiplier;
  const leftIdx = lowerBound(allNotes, currentTime - fallDuration);
  const rightIdx = lowerBound(allNotes, currentTime + fallDuration);

  updateProgress();
  // 统计信息每100ms更新一次，不每帧更新
  if(!lastStatUpdate || now - lastStatUpdate > 0.1){
    lastStatUpdate = now;
    const played = nextNoteIndex;
    const total = allNotes.length;
    document.getElementById('statPlayed').textContent = '已播：' + played + '/' + total;
    document.getElementById('statPercent').textContent = (total > 0 ? (played / total * 100).toFixed(2) : '0.00') + '%';
  }
  drawScene(allNotes, leftIdx, rightIdx, currentTime);

  if(currentTime >= totalDuration){
    if(loopEnabled){
      currentTime = 0;
      nextNoteIndex = 0;
      playStartTime = audioCtx.currentTime;
    } else {
      // 顺序播放：自动播下一首
      const sel = document.getElementById('songSel');
      const nextIdx = sel.selectedIndex + 1;
      if(nextIdx < sel.options.length){
        sel.selectedIndex = nextIdx;
        onSongChange(sel.value);
        return;
      } else {
        stopPlay();
        return;
      }
    }
  }
  rafId = requestAnimationFrame(playLoop);
}

function updateProgress(){
  const pct = totalDuration ? (currentTime / totalDuration) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('curTime').textContent = formatTime(currentTime);
}

/* ============================================================
 * 5. Canvas 可视化：88键钢琴 + 下落音符
 * ========================================================== */
const canvas = document.getElementById('visualCanvas');
const ctx = canvas.getContext('2d');
let C = { w: 800, h: 500 };
let cachedLayout = null;
let keyByMidi = null;       // midi -> key，O(1)查找
let staticCanvas = null;    // 离屏canvas：预渲染静态元素
let staticCtx = null;

function resizeCanvas(){
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(320, Math.floor(r.width * devicePixelRatio));
  canvas.height = Math.max(320, Math.floor(r.height * devicePixelRatio));
  C.w = canvas.width; C.h = canvas.height;
  // 重新计算布局和映射
  cachedLayout = getKeyLayout();
  keyByMidi = new Array(109).fill(null);
  cachedLayout.keys.forEach(k => { keyByMidi[k.midi] = k; });
  // 预渲染静态元素到离屏canvas
  renderStatic();
  drawScene(allNotes, 0, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

// 预渲染静态元素（背景、轨道线、琴键、音名）
function renderStatic(){
  if(!staticCanvas) staticCanvas = document.createElement('canvas');
  staticCanvas.width = C.w; staticCanvas.height = C.h;
  const sctx = staticCanvas.getContext('2d');
  const layout = cachedLayout;
  const keyAreaH = 80 * devicePixelRatio;
  const keyTop = C.h - keyAreaH;
  const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  // 背景
  sctx.fillStyle = '#0a0a10';
  sctx.fillRect(0, 0, C.w, C.h);
  // 轨道线
  sctx.strokeStyle = 'rgba(255,255,255,0.03)';
  sctx.lineWidth = 1;
  layout.keys.forEach(k => {
    if(!k.isBlack){
      sctx.beginPath();
      sctx.moveTo(k.x, 0);
      sctx.lineTo(k.x, keyTop);
      sctx.stroke();
    }
  });
  // 白键
  layout.keys.forEach(k => {
    if(k.isBlack) return;
    sctx.fillStyle = '#f0f0f0';
    sctx.fillRect(k.x, keyTop, k.w - 1, keyAreaH);
    sctx.strokeStyle = '#ccc';
    sctx.strokeRect(k.x, keyTop, k.w - 1, keyAreaH);
  });
  // 黑键
  layout.keys.forEach(k => {
    if(!k.isBlack) return;
    sctx.fillStyle = '#1a1a1a';
    sctx.fillRect(k.x, keyTop, k.w, keyAreaH * 0.62);
  });
  // 音名：字母大、数字下标小，同一水平线
  const whiteW = layout.whiteW;
  const fontSize = Math.max(5 * devicePixelRatio, Math.min(8 * devicePixelRatio, whiteW * 0.55));
  const smallFont = fontSize * 0.7;
  sctx.fillStyle = 'rgba(0,0,0,0.45)';
  sctx.textAlign = 'left';
  layout.keys.forEach(k => {
    if(k.isBlack) return;
    const name = noteNames[k.midi % 12];
    const oct = Math.floor(k.midi / 12) - 1;
    const baseY = C.h - 3 * devicePixelRatio;
    // 字母
    sctx.font = `${fontSize}px sans-serif`;
    const letterW = fontSize * 0.55;
    const startX = k.x + k.w / 2 - letterW * 0.8;
    sctx.fillText(name, startX, baseY);
    // 数字（下标，更小更靠下）
    sctx.font = `${smallFont}px sans-serif`;
    sctx.fillText(String(oct), startX + letterW * 0.9, baseY + smallFont * 0.3);
  });
}

// 88键布局
const WHITE_KEYS = [0,2,4,5,7,9,11];
const BLACK_KEYS = [1,3,6,8,10];
function isBlackKey(midi){ return BLACK_KEYS.includes(midi % 12); }
function getKeyLayout(){
  const keys = [];
  let whiteIdx = 0;
  for(let midi = 21; midi <= 108; midi++){
    if(!isBlackKey(midi)){
      keys.push({midi, x: whiteIdx, isBlack: false});
      whiteIdx++;
    }
  }
  const totalWhite = whiteIdx;
  const whiteW = C.w / totalWhite;
  const blackW = whiteW * 0.6;
  const result = [];
  whiteIdx = 0;
  for(let midi = 21; midi <= 108; midi++){
    if(!isBlackKey(midi)){
      result.push({midi, x: whiteIdx * whiteW, w: whiteW, isBlack: false});
      whiteIdx++;
    } else {
      result.push({midi, x: whiteIdx * whiteW - blackW / 2, w: blackW, isBlack: true});
    }
  }
  return {keys: result, whiteW, blackW, totalWhite};
}

function drawScene(notes, startIdx, endIdx, curTime){
  curTime = curTime || 0;
  // 直接贴预渲染的静态层
  ctx.drawImage(staticCanvas, 0, 0);
  const keyAreaH = 80 * devicePixelRatio;
  const keyTop = C.h - keyAreaH;
  const fallDuration = 2.0 / fallSpeedMultiplier;
  const invFallDur = 1 / fallDuration;
  const minH = 6 * devicePixelRatio;
  const radius = 3 * devicePixelRatio;
  // 复用Set，不每帧新建
  activeKeySet.clear();

  // 按颜色分组：三组velocity，每组一个path，一次fill
  const colors = ['#4f46e5', '#6366f1', '#8b5cf6'];
  const paths = [new Path2D(), new Path2D(), new Path2D()];
  let hasAny = false;

  // 裁剪到琴键以上区域，音符沉入琴键时不遮盖
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, C.w, keyTop);
  ctx.clip();

  for(let i = startIdx; i < endIdx; i++){
    const n = notes[i];
    const key = keyByMidi[n.midi];
    if(!key) continue;
    const timeUntilStart = n.time - curTime;
    // 记录当前正在播放的键
    if(timeUntilStart <= 0 && n.time + n.duration >= curTime){
      activeKeySet.add(n.midi);
    }
    const noteH = n.duration * invFallDur * keyTop;
    const h = noteH < minH ? minH : noteH;
    const bottomY = keyTop - timeUntilStart * invFallDur * keyTop;
    const y = bottomY - h;
    // 整个音符沉入琴键后才消失
    if(y > keyTop || bottomY <= 0) continue;
    const ci = n.velocity > 0.7 ? 2 : (n.velocity > 0.4 ? 1 : 0);
    paths[ci].roundRect(key.x + 1, y, key.w - 2, h, radius);
    hasAny = true;
  }
  ctx.restore();

  if(hasAny){
    for(let c = 0; c < 3; c++){
      ctx.fillStyle = colors[c];
      ctx.fill(paths[c]);
    }
  }

  // 按键高亮
  if(activeKeySet.size > 0){
    ctx.fillStyle = 'rgba(139,92,246,0.7)';
    activeKeySet.forEach(midi => {
      const key = keyByMidi[midi];
      if(!key) return;
      if(key.isBlack){
        ctx.fillRect(key.x, keyTop, key.w, keyAreaH * 0.62);
      } else {
        ctx.fillRect(key.x, keyTop, key.w - 1, keyAreaH);
      }
    });
  }
}

// 初始化
resizeCanvas();
document.getElementById('playBtn').addEventListener('click', () => {});
</script>
