<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · teecatt</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--accent2:#3fb950;--hover:#21262d;--violet:#c822ff;--red:#ff3f58;--warn:#e8b64c}
*{margin:0;padding:0;box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;padding:0 24px;gap:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{font-size:16px;font-weight:700;background:linear-gradient(120deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .sub{font-size:12px;color:var(--muted)}
.hero{padding:56px 24px 8px;text-align:center}
.hero h1{font-size:40px;font-weight:800;margin-bottom:12px;background:linear-gradient(120deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.hero p{font-size:13px;color:var(--muted)}
.grid{flex:1;display:grid;gap:18px;justify-content:center;align-content:start;padding:36px 24px 60px;max-width:1080px;margin:0 auto;width:100%;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 22px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:10px;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.card:active{opacity:.82}
.card .ico{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.4)}
.card h2{font-size:16px;font-weight:600}
.card .desc{font-size:12.5px;color:var(--muted);line-height:1.6;flex:1}
.card .go{font-size:13px;color:var(--accent);font-weight:600}
footer{border-top:1px solid var(--line);padding:16px 24px;text-align:center;font-size:11px;color:var(--muted)}
footer a{color:var(--accent)}
@media(max-width:600px){.hero{padding-top:36px}.hero h1{font-size:32px}.grid{padding:24px 16px 40px;gap:14px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">teecatt</span>
  <span class="sub">404</span>
</div>
<div class="hero">
  <h1>404</h1>
  <p>页面不存在或已被移动。下面是从主页实时同步的入口：</p>
</div>
<div class="grid" id="links"></div>
<footer>teecatt · Powered by GitHub Pages · <a href="/">返回首页</a></footer>

<script>
/* 实时从主页 index.html 解析卡片，生成入口按钮，主页更新即自动同步 */
(async function(){
  var grid = document.getElementById('links');
  function addCard(href, title, desc, ico){
    var a = document.createElement('a');
    a.className = 'card';
    a.href = href;
    var d = document.createElement('div'); d.className='ico'; d.textContent = ico || '🔗';
    var h = document.createElement('h2'); h.textContent = title;
    var p = document.createElement('div'); p.className='desc'; p.textContent = desc || '';
    var g = document.createElement('div'); g.className='go'; g.textContent = '打开 →';
    a.appendChild(d); a.appendChild(h); a.appendChild(p); a.appendChild(g);
    grid.appendChild(a);
  }
  function abs(href){
    try{ return new URL(href, location.origin + '/').href; }catch(e){ return href; }
  }
  try{
    var res = await fetch('/', {cache:'no-store'});
    if(!res.ok) throw new Error('fetch '+res.status);
    var html = await res.text();
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var cards = doc.querySelectorAll('.card');
    cards.forEach(function(card){
      var link = card.matches('a.card') ? card : card.querySelector('a.card-body, a.go, a');
      if(!link) return;
      var rawHref = link.getAttribute('href');
      if(!rawHref) return;
      var h2 = card.querySelector('h2');
      var title = h2 ? h2.textContent.replace(/在线版|NEW/g,'').trim() : rawHref;
      var descEl = card.querySelector('.desc');
      var desc = descEl ? descEl.textContent.trim() : '';
      var icoEl = card.querySelector('.ico');
      var ico = icoEl ? icoEl.textContent.trim() : '🔗';
      addCard(abs(rawHref), title, desc, ico);
    });
    if(!grid.children.length) throw new Error('no cards');
  }catch(e){
    /* 回退：静态入口 */
    addCard('/', '返回首页', '', '🏠');
    addCard('/tools/', '资源库', '按类型整理的工具与脚本', '⚙');
    addCard('/links/', '外部实用小工具', '好用的小玩意', '🔗');
    addCard('/music_visualization/', '音频可视化', '10 种可视化样式', '♫');
  }
})();
</script>
</body>
</html>
