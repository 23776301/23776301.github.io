<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="12;url=/">
<title>404 · 页面走丢了 · teecatt</title>
<style>
:root{--bg:#0d1117;--bg2:#0a0d13;--surface:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--violet:#c822ff;--red:#ff3f58}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(88,166,255,.12),transparent),radial-gradient(ellipse 60% 50% at 85% 110%,rgba(200,34,255,.08),transparent),var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.code{position:relative;font-size:clamp(96px,22vw,190px);font-weight:900;letter-spacing:-.04em;line-height:1;background:linear-gradient(120deg,var(--accent) 10%,var(--violet) 60%,var(--red) 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 18px 50px rgba(88,166,255,.28));animation:float 5.5s ease-in-out infinite;user-select:none}
.code::after{content:'404';position:absolute;inset:0;background:linear-gradient(120deg,var(--accent),var(--violet),var(--red));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:blur(28px);opacity:.35;z-index:-1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title{margin-top:20px;font-size:clamp(18px,3.4vw,24px);font-weight:700}
.sub{margin-top:10px;font-size:clamp(13px,2.4vw,14.5px);color:var(--muted);line-height:1.7;max-width:460px;text-align:center}
.countdown{margin-top:18px;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--surface);transition:all .18s;min-height:44px}
.btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn-primary{background:linear-gradient(135deg,rgba(88,166,255,.18),rgba(200,34,255,.14));border-color:rgba(88,166,255,.5)}
.btn-primary:hover{border-color:var(--accent)}
.hint{position:absolute;bottom:20px;font-size:11px;color:rgba(139,148,158,.6)}
@media(max-width:600px){.btns{gap:8px;margin-top:22px}.btn{padding:10px 16px;font-size:13px}}
</style>
</head>
<body>
<div class="code">404</div>
<div class="title">页面走丢了</div>
<div class="sub">你访问的地址不存在、已被移动或刚刚重构过。<br>别担心,站点的其他内容都还在。</div>
<div class="countdown">将在 <span id="sec">12</span> 秒后自动返回首页</div>
<div class="btns">
  <a class="btn btn-primary" href="/">← 返回首页</a>
  <a class="btn" href="/tools/">个人实用工具</a>
  <a class="btn" href="/links/">外部实用小工具</a>
  <a class="btn" href="/music_visualization/">音频可视化</a>
</div>
<div class="hint">teecatt · GitHub Pages</div>
<script>
(function(){
  var el = document.getElementById('sec');
  if(!el) return;
  var left = 12;
  var t = setInterval(function(){
    left--;
    if(left <= 0){ clearInterval(t); location.href = '/'; return; }
    el.textContent = left;
  }, 1000);
})();
</script>
</body>
</html>
