<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
<title>UI Kit 演示 · 圆形按钮 / 配色面板 / 调试面板</title>
<link rel="stylesheet" href="ui-kit.css">
<style>
  body{background:var(--bg);color:var(--text);margin:0;padding:16px;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:28px 0 8px}
  p.note{color:var(--dim);font-size:12px;line-height:1.7;margin:6px 0}
  .top-bar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
  .stage{position:relative;min-height:70vh;margin-top:12px;border:1px dashed var(--border);
         border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>UI Kit 演示</h1>
  <p class="note">圆形按钮（10 钮）/ 配色面板 / 调试面板 / 滑动开关。缩小窗口到 &le;600px 可看到移动端等比网格。</p>

  <div class="top-bar">
    <!-- 第一行：重播 + 选谱 + 全屏 -->
    <div class="top-bar-row">
      <button class="ctl-btn primary" title="重播" aria-label="重播">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M17.6 3.5V7h-3.5"/></svg>
      </button>
      <select aria-label="选择"><option>示例选项 A</option><option>示例选项 B</option></select>
      <button class="ctl-btn primary" title="全屏" aria-label="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 2 22M2 16v6h6"/><path d="M15 9l7-7M22 8V2h-6"/></svg>
      </button>
    </div>

    <!-- 第二行：8 个圆钮（左 4 + spacer + 右 4） -->
    <div class="control-row">
      <div class="ctl-group">
        <button class="ctl-btn primary" title="播放"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></button>
        <button class="ctl-btn primary" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20"/><rect x="17" y="4" width="2" height="16"/></svg></button>
        <button class="ctl-btn primary" title="循环"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
        <button class="ctl-btn primary" id="uploadBtn" title="上传"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5a3 3 0 0 1 3-3h8.7a4 4 0 0 1 2.3.7l4.9 3.5a4 4 0 0 0 2.3.7H40.5a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3h-33a3 3 0 0 1-3-3z"/><path d="M24 33.5v-14m6 6L24 19.5l-6 6"/></svg></button>
      </div>
      <div class="ctl-spacer"></div>
      <div class="ctl-group">
        <button class="ctl-btn primary" title="管理"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="3" cy="6" r="1.5"/><circle cx="3" cy="10" r="1.5"/><circle cx="3" cy="14" r="1.5"/><rect x="7" y="5.2" width="11" height="1.6" rx=".8"/><rect x="7" y="9.2" width="11" height="1.6" rx=".8"/><rect x="7" y="13.2" width="11" height="1.6" rx=".8"/></svg></button>
        <button class="ctl-btn primary" id="settingsBtn" title="设置"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a8 8 0 0 0-1.7-1L15 3H9l-.3 2.9a8 8 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.9 7.9 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a8 8 0 0 0 1.7 1L9 21h6l.3-2.9a8 8 0 0 0 1.7-1l2.5 1 2-3.5z" opacity=".55"/></svg></button>
        <button class="ctl-btn primary drop-trigger" id="paletteToggleBtn" data-panel="paletteRow" title="配色"><svg id="paletteToggleIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0 0 20 2.5 2.5 0 0 0 2.5-2.5c0-.6-.2-1.2-.6-1.7a.5.5 0 0 1 .4-.8H16a6 6 0 0 0 0-12z"/></svg></button>
        <button class="ctl-btn primary drop-trigger" id="debugToggleBtn" data-panel="debugPanel" title="调试"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-2.8A5 5 0 0 0 15 4.6V3a1 1 0 1 0-2 0v1.1a5.2 5.2 0 0 0-2 0V3a1 1 0 1 0-2 0v1.6A5 5 0 0 0 6.8 8H4a1 1 0 1 0 0 2h2.1a5 5 0 0 0 0 2H4a1 1 0 1 0 0 2h2.8a5 5 0 0 0 10.4 0H20a1 1 0 1 0 0-2h-2.1a5 5 0 0 0 0-2H20a1 1 0 1 0 0-2M12 17a3 3 0 0 1-3-3v-4a3 3 0 0 1 6 0v4a3 3 0 0 1-3 3"/></svg></button>
      </div>

      <!-- 配色行（下拉浮层） -->
      <div id="paletteRow" class="palette-row drop-panel">
        <div class="pal-col">
          <div class="pal-grid">
            <button class="pal-btn palette-btn" data-color="#8b5cf6" title="纯紫">A</button>
            <button class="pal-btn palette-btn active" data-color="#c20c0c" title="青蓝×琥珀红">B</button>
            <button class="pal-btn palette-btn" data-color="#fb7299" title="青绿×品红">C</button>
            <button class="pal-btn" id="paletteEditBtn" title="自定义配色">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>
            </button>
          </div>
          <div class="pal-hint">无操作2s自动收起配色面板</div>
        </div>
        <div id="paletteSwatch" style="flex:1 1 0;min-width:0;max-width:340px;height:44px;border-radius:6px;background:linear-gradient(90deg,var(--accent),transparent)"></div>
        <div id="paletteEditor" class="palette-editor">
          <div class="palette-head">
            <h3>自定义配色</h3>
            <button type="button" class="palette-theme-btn active"><span class="sw" id="themeSw" style="background:var(--accent)"></span><span>主题色</span></button>
          </div>
          <div id="paletteEndpoints"></div>
          <div class="palette-preset-row">
            <span class="pp-title">常用</span>
            <div class="palette-presets" id="presets"></div>
          </div>
          <div class="palette-colors">
            <div class="palette-board-wrap">
              <canvas id="colorBoard" width="240" height="140"></canvas>
              <span id="colorBoardMarker" class="color-board-marker"></span>
            </div>
            <div class="hsl-sliders">
              <span class="hsl-label">色相</span><div class="hsl-slider" data-hsl="h"><span class="hsl-handle" data-handle="h"></span></div>
              <span class="hsl-label">饱和度</span><div class="hsl-slider" data-hsl="s"><span class="hsl-handle" data-handle="s"></span></div>
              <span class="hsl-label">亮度</span><div class="hsl-slider" data-hsl="l"><span class="hsl-handle" data-handle="l"></span></div>
              <span class="hsl-label">透明度</span><div class="hsl-slider" data-hsl="a"><span class="hsl-handle" data-handle="a"></span></div>
            </div>
          </div>
          <div class="palette-foot">
            <span>正在设置：<b style="color:#fff">主题色</b></span>
            <span style="display:flex;align-items:center;gap:5px">当前<span id="palettePickPreview"></span></span>
          </div>
        </div>
      </div>

      <!-- 调试面板（下拉浮层） -->
      <div class="debug-panel drop-panel" id="debugPanel">
        <div class="dbg-header">
          <div class="dbg-toolbar">
            <label class="switch"><input id="dbgEnabled" type="checkbox" checked><span class="track"><span class="knob"></span></span>启用调试</label>
            <button class="dbg-reset-btn" title="重置"><span>重置所有选项</span><svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.9 2.6a.5.5 0 0 1 0 .7L4.2 5H11a6 6 0 1 1-6 6 .5.5 0 0 1 1 0 5 5 0 1 0 5-5H4.2l1.7 1.6a.5.5 0 1 1-.7.7l-2.5-2.5a.5.5 0 0 1 0-.7l2.5-2.5a.5.5 0 0 1 .7 0"/></svg></button>
            <button class="dbg-reset-btn" title="清空日志"><span>清空日志</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
          <div class="dbg-off-hint">调试已关闭，无日志采集与监控。</div>
          <div class="dbg-body">
            <div class="dbg-actions">
              <label class="switch"><input type="checkbox" checked><span class="track"><span class="knob"></span></span>渲染降级自动弹出</label>
              <button title="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button title="下载"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg></button>
              <button title="顶部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
              <button title="底部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
            </div>
          </div>
        </div>
        <div class="dbg-log" id="debugLog"></div>
      </div>
    </div>
  </div>

  <div class="stage">内容区（下拉浮层会浮在这上面）</div>

  <h2>滑动开关 .switch</h2>
  <label class="switch"><input type="checkbox" checked><span class="track"><span class="knob"></span></span>已开启</label>
  &nbsp;&nbsp;
  <label class="switch"><input type="checkbox"><span class="track"><span class="knob"></span></span>已关闭</label>
</div>

<script>
(function(){
  /* ---- 面板开关：点触发钮 toggle 对应 .drop-panel ---- */
  document.querySelectorAll('[data-panel]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var p = document.getElementById(btn.dataset.panel);
      var willOpen = !p.classList.contains('open');
      document.querySelectorAll('.drop-panel.open').forEach(function(x){ x.classList.remove('open'); });
      if(willOpen) p.classList.add('open');
    });
  });
  document.getElementById('paletteEditBtn').addEventListener('click', function(e){
    e.stopPropagation();
    var ed = document.getElementById('paletteEditor');
    ed.classList.toggle('open');
    if(ed.classList.contains('open')) setTimeout(placeHandles, 0);
  });
  document.getElementById('debugToggleBtn').addEventListener('click', function(){
    document.getElementById('debugLog').innerHTML =
      ['[UI-Kit] 演示日志已就绪','[UI-Kit] 点击配色按钮打开配色面板'].map(function(s){ return '<div>'+s+'</div>'; }).join('');
  });
  document.getElementById('dbgEnabled').addEventListener('change', function(){
    document.getElementById('debugPanel').classList.toggle('dbg-off', !this.checked);
  });

  /* ---- 配色：HSL 状态 + 色板 + 滑块 ---- */
  var S = { h: 0, s: 100, l: 42, a: 1 };
  var root = document.documentElement.style;
  var board = document.getElementById('colorBoard'), ctx = board.getContext('2d');
  var marker = document.getElementById('colorBoardMarker');

  function hex(h,s,l){ // hsl -> #rrggbb（便于设置 --accent-a18/28 的 rgba）
    s/=100; l/=100;
    var k=function(n){return (n+h/30)%12;}, a=s*Math.min(l,1-l);
    var f=function(n){return Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));};
    return '#'+[f(0),f(8),f(4)].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
  }
  function apply(){
    var col = 'hsl('+S.h+','+S.s+'%,'+S.l+'%)';
    root.setProperty('--accent', col);
    var c = hex(S.h,S.s,S.l), n=parseInt(c.slice(1),16);
    root.setProperty('--accent-a18','rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.18)');
    root.setProperty('--accent-a28','rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.28)');
    document.getElementById('themeSw').style.background = col;
    document.getElementById('paletteSwatch').style.background =
      'linear-gradient(90deg,'+col+' '+Math.round(S.a*100)+'%,transparent)';
    document.getElementById('palettePickPreview').style.background = col;
    placeHandles();
  }
  function placeHandles(){
    document.querySelectorAll('.hsl-handle').forEach(function(h){
      var k=h.dataset.handle, v = k==='h'? S.h/360 : k==='s'? S.s/100 : k==='l'? S.l/100 : S.a;
      h.style.left = (v*100)+'%';
    });
    marker.style.left = (S.h/360*board.clientWidth)+'px';
    marker.style.top  = ((1-S.l/100)*board.clientHeight)+'px';
    marker.style.background = 'hsl('+S.h+','+S.s+'%,'+S.l+'%)';
  }
  function drawBoard(){
    var w=board.width, h=board.height;
    for(var x=0;x<w;x++){
      var g=ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#fff');
      g.addColorStop(0.5,'hsl('+(x/w*360)+',100%,50%)');
      g.addColorStop(1,'#000');
      ctx.fillStyle=g; ctx.fillRect(x,0,1,h);
    }
  }
  drawBoard(); apply();
  window.addEventListener('resize', placeHandles);

  function pickBoard(e){
    var r=board.getBoundingClientRect();
    var x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    var y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    S.h=x*360; S.l=(1-y)*100; apply();
  }
  board.addEventListener('pointerdown', function(e){ board.setPointerCapture(e.pointerId); pickBoard(e); });
  board.addEventListener('pointermove', function(e){ if(e.buttons) pickBoard(e); });

  document.querySelectorAll('.hsl-slider').forEach(function(sl){
    function pick(e){
      var r=sl.getBoundingClientRect(), k=sl.dataset.hsl;
      var v=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      if(k==='h') S.h=v*360; else if(k==='s') S.s=v*100; else if(k==='l') S.l=v*100; else S.a=v;
      apply();
    }
    sl.addEventListener('pointerdown', function(e){ sl.setPointerCapture(e.pointerId); pick(e); });
    sl.addEventListener('pointermove', function(e){ if(e.buttons) pick(e); });
  });

  document.querySelectorAll('.palette-btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.palette-btn').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      var c=b.dataset.color, n=parseInt(c.slice(1),16);
      root.setProperty('--accent', c);
      root.setProperty('--accent-a18','rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.18)');
      root.setProperty('--accent-a28','rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.28)');
    });
  });
  // 常用预设
  ['#c20c0c','#8b5cf6','#0ea5e9','#10b981','#f59e0b','#fb7299','#6366f1','#e11d48'].forEach(function(c){
    var b=document.createElement('button'); b.className='pp-item';
    b.innerHTML='<span class="pp-swatch" style="background:'+c+'"></span><span class="pp-name">'+c.slice(1,4)+'</span>';
    b.addEventListener('click', function(){
      var n=parseInt(c.slice(1),16);
      root.setProperty('--accent', c);
      root.setProperty('--accent-a18','rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.18)');
      root.setProperty('--accent-a28','rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.28)');
    });
    document.getElementById('presets').appendChild(b);
  });
})();
</script>
</body>
</html>
