<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebRTC 局域网互传</title>
    <style>
        .status { color: #ff4444; }
        .success { color: #00c851; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 20px; }
        input, button { padding: 8px 12px; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC 局域网互传</h1>
        <!-- 1. 昵称设置模块 -->
        <div>
            <label>你的昵称：</label>
            <input type="text" id="nicknameInput" placeholder="输入你的昵称" maxlength="10">
            <button id="setNicknameBtn">确认设置</button>
            <p>当前昵称：<span id="currentNickname">未设置</span></p>
        </div>

        <!-- 2. 状态与操作模块 -->
        <div>
            <p>状态：<span id="connectionStatus" class="status">未初始化</span></p>
            <button id="initBtn">初始化连接</button>
            <button id="sendTestBtn" disabled>发送测试消息</button>
        </div>

        <!-- 3. 消息/日志显示模块 -->
        <div>
            <h3>通信日志</h3>
            <div id="logContainer" style="height: 200px; border: 1px solid #ccc; padding: 10px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // 核心变量初始化
        let peerConnection; // WebRTC连接对象
        let dataChannel;    // 数据通道（用于传输消息/文件）
        const config = {
            // 局域网环境无需公网ICE服务器，使用默认配置即可
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] 
        };

        // DOM元素获取
        const nicknameInput = document.getElementById('nicknameInput');
        const setNicknameBtn = document.getElementById('setNicknameBtn');
        const currentNickname = document.getElementById('currentNickname');
        const connectionStatus = document.getElementById('connectionStatus');
        const initBtn = document.getElementById('initBtn');
        const sendTestBtn = document.getElementById('sendTestBtn');
        const logContainer = document.getElementById('logContainer');

        // 1. 昵称设置功能
        setNicknameBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            if (!nickname) {
                addLog('请输入有效的昵称', 'warning');
                return;
            }
            currentNickname.textContent = nickname;
            addLog(`昵称设置成功：${nickname}`, 'success');
        });

        // 2. WebRTC初始化功能（解决“未初始化”问题）
        initBtn.addEventListener('click', async () => {
            if (!currentNickname.textContent || currentNickname.textContent === '未设置') {
                addLog('请先设置昵称再初始化连接', 'warning');
                return;
            }

            try {
                // 创建PeerConnection对象，初始化连接
                peerConnection = new RTCPeerConnection(config);
                connectionStatus.textContent = '初始化中...';
                addLog('开始初始化WebRTC连接', 'info');

                // 创建数据通道（用于传输数据）
                dataChannel = peerConnection.createDataChannel('lanTransferChannel', { ordered: true });
                dataChannel.onopen = handleDataChannelOpen;
                dataChannel.onmessage = handleDataChannelMessage;
                dataChannel.onclose = handleDataChannelClose;

                // 监听ICE候选（局域网设备发现）
                peerConnection.onicecandidate = (e) => {
                    if (e.candidate) {
                        addLog(`发现局域网设备候选：${JSON.stringify(e.candidate).substring(0, 50)}...`, 'info');
                        // 注：实际局域网互传需添加“候选码交换”逻辑（如二维码展示/输入），此处简化为日志显示
                    }
                };

                // 监听连接状态变化
                peerConnection.onconnectionstatechange = () => {
                    connectionStatus.textContent = peerConnection.connectionState;
                    if (peerConnection.connectionState === 'connected') {
                        connectionStatus.className = 'success';
                        sendTestBtn.disabled = false;
                        addLog('已成功建立局域网连接', 'success');
                    }
                };

                // 创建offer（发起连接请求）
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                addLog(`生成连接请求：${JSON.stringify(offer).substring(0, 60)}...`, 'info');

            } catch (error) {
                connectionStatus.textContent = '初始化失败';
                addLog(`初始化错误：${error.message}`, 'error');
            }
        });

        // 3. 测试消息发送功能
        sendTestBtn.addEventListener('click', () => {
            const message = `[${currentNickname.textContent}] 测试消息：${new Date().toLocaleTimeString()}`;
            if (dataChannel.readyState === 'open') {
                dataChannel.send(message);
                addLog(`已发送：${message}`, 'send');
            } else {
                addLog('数据通道未打开，无法发送消息', 'error');
            }
        });

        // 4. 数据通道事件处理
        function handleDataChannelOpen() {
            addLog('数据通道已打开，可开始传输数据', 'success');
        }
        function handleDataChannelMessage(e) {
            addLog(`收到消息：${e.data}`, 'receive');
        }
        function handleDataChannelClose() {
            addLog('数据通道已关闭', 'info');
            connectionStatus.textContent = '连接已断开';
            connectionStatus.className = 'status';
            sendTestBtn.disabled = true;
        }

        // 5. 日志添加工具函数
        function addLog(content, type = 'info') {
            const logItem = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            // 按类型设置日志颜色
            const colorMap = {
                success: '#00c851', warning: '#ff8800', error: '#ff4444',
                send: '#2196f3', receive: '#9c27b0', info: '#333'
            };
            logItem.style.color = colorMap[type] || '#333';
            logItem.innerHTML = `<small>[${time}]</small> ${content}`;
            logContainer.appendChild(logItem);
            // 滚动到最新日志
            logContainer.scrollTop = logContainer.scrollHeight;
        }
    </script>
</body>
</html>
